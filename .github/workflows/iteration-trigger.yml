name: Iteration Trigger

# Posts a brief executive summary on a PR (commenting as the repo owner via PAT)
# whenever CI completes fully green AND a Claude review has been posted.
# The comment is intended to fire a webhook that wakes the Claude Code mobile
# app via MCP so it can continue iterating on feedback. Capped at 10 self-posts
# per PR to avoid runaway loops.
#
# The "cleared to squash merge" line this job emits is a merge instruction, so it
# must enforce the SAME invariants as scripts/ralph/pr-ready.sh or it becomes a
# second code path that falsifies it. It therefore mirrors five of them, and
# names the blocker instead of clearing when any fails:
#   * no `do-not-auto-merge` hold on the PR;
#   * the head is current with its base (compare API `behind_by == 0`);
#   * the verdict carries the `<!-- creek-review pr=N -->` provenance marker for
#     THIS PR (#1181) — the marker pr-ready.sh's MARKER_RE parses, read from the
#     same comment the verdict came from;
#   * the verdict was posted by an account the review pipeline can authenticate
#     as (#1199) — the same two-member allowlist pr-ready.sh's
#     VERDICT_AUTHORS_JQ holds, byte for byte, applied INSIDE the comment
#     selector so a forged comment is skipped rather than picked and refused;
#   * and the verdict's BODY is still the one its author wrote (#1263): an
#     account with write/triage access can retype somebody else's
#     CHANGES_REQUESTED as an LGTM, leaving the author, the timestamp and the
#     provenance marker untouched, so `userContentEdits` is the only field that
#     disagrees.
# The last two do not reach the blocker chain at all: either one means no verdict
# was found, so the step takes the "No Claude review from an accepted author yet"
# early exit and no summary is ever composed.
# All five fail closed on an unreadable answer.
#
# THE LAST THREE ARE NO LONGER MIRRORED — THEY ARE SHARED (#1266, #1263). The
# marker parse, the author allowlist and the edit check all live in
# `scripts/ralph/lib/verdict-select.jq`, which this job and pr-ready.sh both
# run over the payload `scripts/ralph/lib/pr-comments.graphql` both fetch. That
# is not tidiness: the two hand-parallel copies this replaces are precisely how
# a `.body != null` guard came to exist in one clearance path and not the other
# (#1266), and how #1199's allowlist had to be written twice.
#
# AND THE CLEARANCE CHAIN ITSELF IS NO LONGER IN THIS FILE (#1685). The hold,
# the currency check and which blocker to name live in
# `scripts/ralph/verdict-wake.sh`, which the summary step below calls. A `run:`
# body is never EXECUTED by a test, so every guard on the version that lived
# here was a per-line `grep` and therefore evadable by keeping the guarded line
# alive and making it dead — measured, three such mutants survived a fully green
# suite. `scripts/ralph/test_verdict_wake.sh` drives the script end to end
# instead; `scripts/ralph/test_pr_ready.sh` and
# `creek-tools/tests/test_verdict_clearance_parity.py` keep the static coupling
# assertions, now aimed at the script, as a cheap second line.
#
# AND EVERY ONE THAT REACHES THE CLEARANCE CHAIN REWRITES `VERDICT`, NOT JUST
# `ACTION` (#1202) — the first three; the authorship one never gets that far,
# because a thread with no accepted-author verdict produces no summary at all.
# `VERDICT` is computed from the review comment ABOVE the chain, so a branch that
# refuses while leaving it alone still posts `**VERDICT**: LGTM` + `**CI**: N/N
# Green` — and those two fields are the ONLY ones the merge path reads
# (`.claude/skills/await-claude-review/SKILL.md` Step 4a; its item 5 says in as
# many words "Do not infer a verdict from the `Action:` prose"). `ACTION` is
# diagnostic; `VERDICT` is the gate. The refusal values are chosen for their
# BYTES — `HELD`, `NOT ATTESTED`, `NOT CURRENT` — none containing an `LGTM`
# substring and none being one of the three verdicts SKILL.md recognises, so
# Step 4a falls to item 5 and surfaces to a human instead of merging.
# scripts/ralph/test_pr_ready.sh walks that chain — in
# `scripts/ralph/verdict-wake.sh`, where it now lives — and fails on any
# NOT-cleared branch that leaves `VERDICT` alone, including ones added after
# this comment, while scripts/ralph/test_verdict_wake.sh pins each branch's
# posted summary by behaviour.
#
# Required secrets:
#   GEOFFE_GA_PAT  - personal access token for the repo owner with `pull-requests: write`.
#                    Without this the comment would post as github-actions[bot]
#                    and the mobile webhook would not recognize the author.

on:
  workflow_run:
    # Must match the upstream workflows' ``name:`` exactly — this repo's CI
    # workflow is named "CI/CD Pipeline" (.github/workflows/ci.yml). "Claude
    # Code Review" is included so the trigger re-fires when the verdict comment
    # lands AFTER CI has already completed — otherwise the merge clearance
    # would never be evaluated for that ordering.
    workflows: ["CI/CD Pipeline", "Claude Code Review"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  nudge:
    name: Post executive summary
    # `workflow_run.event == 'pull_request'` DELIBERATELY EXCLUDES #1201's
    # manually dispatched re-reviews, and widening it alone would be WORSE than
    # the gap. The "Resolve PR number" step below resolves the PR from
    # `workflow_run.head_branch`; on a dispatch that is the ref the run was fired
    # from, so the lookup would ask `--head main` and could answer with an
    # unrelated open PR. Today that fails safe only because the clearance chain
    # refuses on `[ "$MARKER_PR" != "$PR" ]`. Doing it properly means resolving
    # the PR from the review comment's own provenance marker instead of from the
    # branch, which is a separate change with its own failure modes — filed as a
    # follow-up rather than smuggled in here. The consequence of leaving it: a
    # dispatched review still posts its verdict comment and pr-ready.sh reads it
    # normally; only the executive-summary wake does not fire for that run.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number from head branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR=$(gh pr list -R "$REPO" --head "$BRANCH" --state open \
                 --json number --jq '.[0].number // empty')
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      # THE SHARED VERDICT MACHINERY HAS TO BE ON DISK TO BE READ (#1266, #1263).
      #
      # SECURITY, AND IT IS THE ENABLING FACT RATHER THAN AN AFTERTHOUGHT: this
      # job holds GEOFFE_GA_PAT, so a checkout here is new surface. On a
      # `workflow_run` trigger `actions/checkout` resolves the BASE REPOSITORY'S
      # DEFAULT BRANCH — never the PR head — so a fork PR cannot supply its own
      # `verdict-select.jq` and clear its own merge. That is exactly why sharing
      # one filter file with `scripts/ralph/pr-ready.sh` is safe here.
      #
      # DO NOT PIN `ref:` TO `github.event.workflow_run.head_branch`, or to
      # anything else derived from the PR. Doing so hands an attacker the
      # selector that decides whether their own PR is cleared to merge.
      # `persist-credentials: false` because nothing here pushes, and a PAT has
      # no business sitting in the workspace git config.
      - name: Check out the shared verdict filter (default branch, never the PR head)
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # THE SUMMARY LOGIC IS A SCRIPT, NOT A `run:` BODY (#1685). Everything
      # this step used to do inline now lives in `scripts/ralph/verdict-wake.sh`
      # — the payload fetch, the self-post cap, the shared verdict selector, the
      # clearance chain and the four-line summary — and this step is a thin call
      # to it.
      #
      # THAT IS A TESTABILITY FIX, AND IT IS THE POINT. A `run:` body is never
      # EXECUTED by any test: the only defence available against it was per-line
      # `grep` over this YAML, and every static guard on a script nobody runs is
      # evadable by keeping the guarded line alive and making it DEAD. MEASURED
      # against the then-green suite: keeping the real
      # `-f scripts/ralph/lib/verdict-select.jq comments.json` call on a live
      # line while assigning it to an unread variable, and setting the real
      # answer from an inline selector emitting an unconditional clearance, left
      # every assertion in the repo passing while this step cleared EVERY PR.
      # `scripts/ralph/pr-ready.sh` — a real script with a real harness — killed
      # the same mutant sixty times over.
      #
      # `scripts/ralph/test_verdict_wake.sh` now drives that script end to end
      # against fixtures with a stubbed `gh`, so a decoy invocation changes
      # OBSERVABLE OUTPUT. The static guards in `scripts/ralph/test_pr_ready.sh`
      # and `creek-tools/tests/test_verdict_clearance_parity.py` follow the code
      # into that file and remain as a cheap second line.
      #
      # THE ENV BLOCK IS THE CONTRACT and stays here, because it is the half
      # only the workflow can supply. `GH_TOKEN` is `secrets.GEOFFE_GA_PAT` with
      # NO `|| secrets.GITHUB_TOKEN` fallback — unlike code-review.yml — because
      # `.claude/skills/await-claude-review/SKILL.md`'s summary recognition names
      # exactly ONE author. Adding a fallback here authors summaries as the
      # Actions bot, fails that check, and kills the wake path on every lane
      # silently; `scripts/ralph/test_pr_ready.sh` asserts the absence.
      - name: Compose and post summary
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GEOFFE_GA_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          MARKER: '<!-- iteration-trigger -->'
        run: bash scripts/ralph/verdict-wake.sh
