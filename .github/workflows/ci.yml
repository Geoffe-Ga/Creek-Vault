name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_DEFAULT_VERSION: '3.12'
  COVERAGE_THRESHOLD: 90
  DOCSTRING_COVERAGE_THRESHOLD: 95
  PYLINT_FAIL_UNDER: '9.0'
  PER_FILE_COVERAGE_THRESHOLD: '80'
  PER_FILE_COVERAGE_WAIVER_FLOOR: '65'

jobs:
  quality:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creek-tools
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('creek-tools/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-
            ${{ runner.os }}-uv-

      - name: Install uv
        # Pin uv so a uv release cannot change resolution or CLI
        # behaviour out from under CI; bump deliberately with uv.lock.
        run: python -m pip install 'uv==0.8.17'

      - name: Install dependencies (locked)
        # Install the fully-pinned uv.lock straight into the runner's
        # Python — no virtualenv, no PATH indirection — so every quality
        # step below resolves its tools exactly as it did under the
        # previous pip flow. `uv export --locked` fails the build if
        # uv.lock has drifted from pyproject.toml.
        run: |
          uv export --locked --all-extras --no-emit-project --no-hashes \
            -o /tmp/locked-requirements.txt
          uv pip install --system -r /tmp/locked-requirements.txt
          uv pip install --system --no-deps -e .

      - name: Create necessary directories
        run: |
          mkdir -p reports

      - name: Run Ruff linting
        # --exit-non-zero-on-fix: if ruff finds an auto-fixable issue
        # the developer didn't commit, fail rather than silently report.
        run: ruff check . --output-format=github --exit-non-zero-on-fix

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run Pylint (CI-002)
        # ./scripts/pylint.sh runs `python -m pylint creek/` with the
        # configured --fail-under threshold and optionally writes a JSON
        # snapshot. Same script the local check-all.sh runs, so a
        # developer who passes locally cannot fail this gate (CI-004).
        env:
          PYLINT_FAIL_UNDER: ${{ env.PYLINT_FAIL_UNDER }}
        run: ./scripts/pylint.sh --json reports/pylint-report.json

      - name: Run MyPy type checking (CI-001)
        # Project-wide strict mode is configured in pyproject.toml; the
        # script runs `mypy creek/` so local and CI agree.
        run: ./scripts/typecheck.sh

      - name: Run Refurb (STYLE-001 modernisation gate)
        # Backlog closed in STYLE-001 (148 → 0). Any new violation
        # blocks CI; `# noqa: FURB…` is available for documented
        # carve-outs (see creek-tools/CLAUDE.md §6.1).
        run: ./scripts/lint-refurb.sh

      - name: Run Tryceratops (STYLE-001 exception-hygiene gate)
        # Backlog closed in STYLE-001 (21 → 0). Any new violation
        # blocks CI; `# noqa: TRY…` covers documented carve-outs.
        run: ./scripts/lint-tryceratops.sh

      - name: Check docstring coverage
        run: |
          interrogate -vv \
            --fail-under=${{ env.DOCSTRING_COVERAGE_THRESHOLD }} creek/

      - name: Run Bandit security scan
        # The first invocation only produces the JSON artifact and is
        # intentionally non-gating (`|| true`). The SECOND invocation
        # is the real gate: `bandit -r creek/ -ll` exits non-zero on
        # any medium-or-above finding, with no escape hatch.
        run: |
          bandit -r creek/ -f json -o reports/bandit-report.json || true
          bandit -r creek/ -ll

      - name: Run pip-audit dependency check
        # Documented CVEs in build/install tooling. Each excluded with a
        # justification + advisory link, kept in sync with
        # scripts/security.sh. Audit this list at every release.
        #   - PYSEC-2022-42969: ReDoS in py.path.svnwc; py is a transitive
        #     dev dep (pulled in by pytest plugins); the affected code path
        #     is unused.
        #     https://github.com/advisories/GHSA-w596-4wvx-j9j6
        #   - CVE-2025-8869: pip — symlink TOCTOU during sdist install; the
        #     installer never runs against untrusted sdists in CI.
        #     https://nvd.nist.gov/vuln/detail/CVE-2025-8869
        #   - CVE-2026-1703: pip — index-URL parsing; CI installs from
        #     declared requirements only, so untrusted indexes are not in
        #     scope.
        #     https://nvd.nist.gov/vuln/detail/CVE-2026-1703
        #   - CVE-2026-3219: pip — no fix published yet; same scope as
        #     above.
        #     https://nvd.nist.gov/vuln/detail/CVE-2026-3219
        #   - CVE-2026-24049: wheel — RECORD parsing edge case; wheel is
        #     build-tooling only and never reaches the production runtime.
        #     https://nvd.nist.gov/vuln/detail/CVE-2026-24049
        #   - PYSEC-2025-189..197, PYSEC-2025-210, PYSEC-2026-139 (torch)
        #     and PYSEC-2025-211..218 (transformers): transitive via the
        #     `embeddings` extra. No patched release exists — torch
        #     2.12.0 and transformers 5.9.0 (the latest, as of
        #     2026-05-21) still carry every advisory. torch's are
        #     local-access memory-corruption/DoS bugs; transformers' are
        #     RCE via malicious checkpoints. creek-tools embeds vault
        #     fragments with a pinned, known sentence-transformers model
        #     (FEAT-018) and never loads untrusted checkpoints, so none
        #     are reachable. Re-audit by 2026-06-20; see scripts/security.sh.
        #   - PYSEC-2024-277 (joblib) and PYSEC-2025-183 (pyjwt): both at
        #     their latest release and both formally disputed by the
        #     supplier (joblib path needs trusted-content caching; pyjwt
        #     key length is the caller's choice). Not reachable here.
        # A single `pip-audit --format=json --output=…` call writes the
        # JSON artifact AND gates on findings (pip-audit exits non-zero
        # if any non-ignored vulnerability is reported, regardless of the
        # output flag). No `|| true`, no second invocation needed.
        run: |
          pip-audit --format=json --output=reports/pip-audit-report.json \
            --ignore-vuln PYSEC-2022-42969 \
            --ignore-vuln CVE-2025-8869 \
            --ignore-vuln CVE-2026-1703 \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-24049 \
            --ignore-vuln PYSEC-2025-189 \
            --ignore-vuln PYSEC-2025-190 \
            --ignore-vuln PYSEC-2025-191 \
            --ignore-vuln PYSEC-2025-192 \
            --ignore-vuln PYSEC-2025-193 \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2025-195 \
            --ignore-vuln PYSEC-2025-196 \
            --ignore-vuln PYSEC-2025-197 \
            --ignore-vuln PYSEC-2025-210 \
            --ignore-vuln PYSEC-2026-139 \
            --ignore-vuln PYSEC-2025-211 \
            --ignore-vuln PYSEC-2025-212 \
            --ignore-vuln PYSEC-2025-213 \
            --ignore-vuln PYSEC-2025-214 \
            --ignore-vuln PYSEC-2025-215 \
            --ignore-vuln PYSEC-2025-216 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2025-218 \
            --ignore-vuln PYSEC-2024-277 \
            --ignore-vuln PYSEC-2025-183

      - name: Run tests with coverage (CI-003 — mirrors local default)
        # ./scripts/test.sh excludes integration/e2e by default so local
        # and CI run the same set of tests.
        run: ./scripts/test.sh --unit --coverage
        env:
          COVERAGE_CORE: sysmon

      - name: Verify aggregate coverage threshold
        run: |
          coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }}
          coverage json -o reports/coverage.json

      - name: Verify per-file coverage thresholds (TEST-002)
        run: |
          ./scripts/coverage-per-file.sh \
            --threshold ${{ env.PER_FILE_COVERAGE_THRESHOLD }} \
            --waiver-floor ${{ env.PER_FILE_COVERAGE_WAIVER_FLOOR }} \
            --report reports/coverage.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: creek-tools/coverage.xml
          flags: python-${{ matrix.python-version }}
          name: python-${{ matrix.python-version }}
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: creek-tools/reports/junit.xml
          retention-days: 30

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports-${{ matrix.python-version }}
          path: |
            creek-tools/coverage.xml
            creek-tools/reports/coverage.json
            creek-tools/htmlcov
          retention-days: 30

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports-${{ matrix.python-version }}
          path: |
            creek-tools/reports/bandit-report.json
            creek-tools/reports/pip-audit-report.json
          retention-days: 30

  crawdad:
    name: CrawDad Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawdad
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-crawdad-${{ matrix.python-version }}-${{ hashFiles('crawdad/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-crawdad-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-crawdad-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run check-all.sh
        # Single source of truth: identical script developers run locally.
        run: ./scripts/check-all.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crawdad-coverage-${{ matrix.python-version }}
          path: crawdad/coverage.xml
          retention-days: 30

  complexity-analysis:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creek-tools
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Install complexity tools
        run: |
          pip install radon xenon
          mkdir -p reports

      - name: Calculate cyclomatic complexity (informational)
        run: |
          radon cc creek/ -a -s -j > reports/complexity-cc.json
          radon cc creek/ -a -s

      - name: Calculate maintainability index (informational)
        run: |
          radon mi creek/ -s -j > reports/complexity-mi.json
          radon mi creek/ -s

      - name: Enforce complexity thresholds (CI-002)
        # ./scripts/complexity.sh requires xenon, runs strict thresholds,
        # and exits non-zero on any violation. No `|| true` escape hatch.
        run: ./scripts/complexity.sh

      - name: Upload complexity reports
        uses: actions/upload-artifact@v7
        with:
          name: complexity-reports
          path: creek-tools/reports/complexity-*.json
          retention-days: 30

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creek-tools
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: creek-tools/dist/
          retention-days: 90

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [quality, crawdad, complexity-analysis, build]
    if: always()

    steps:
      - name: Check quality job status
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "Quality checks failed"
            exit 1
          fi
          if [ "${{ needs.crawdad.result }}" != "success" ]; then
            echo "CrawDad quality checks failed"
            exit 1
          fi
          if [ "${{ needs.complexity-analysis.result }}" != "success" ]; then
            echo "Complexity analysis failed"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed"
            exit 1
          fi

      - name: Quality gate passed
        run: echo "All quality gates passed successfully"
