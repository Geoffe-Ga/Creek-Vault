name: "Scan: Dependencies"

# Thin wrapper over the reusable _claude-scan.yml core. Groups compatible minor/patch Dependabot bumps into batch issues and writes a migration-plan issue per major bump.
#
# Clone of scan-todo.yml; see it and _claude-scan.yml for the full rationale
# (auth, permissions, SHA-pinned actions, the scan-issue-writer contract).
# workflow_dispatch is REQUIRED on every scan wrapper — it is the hook the
# queue-depth hopper uses to refill the Ralph backlog off-schedule.

on:
  # PAUSED 2026-08-26: automated issue inflow paused by owner request.
  # Re-enable by uncommenting; workflow_dispatch still allows manual runs.
  # schedule:
  # - cron: "0 6 * * *"       # daily 06:00 UTC (Dependabot runs daily)
  workflow_dispatch:
    inputs:
      max_issues:
        description: "Hard cap on issues created this run."
        required: false
        default: "5"
      backlog_ceiling:
        description: "Override the shared agent-ready backlog ceiling for this run (blank = default)."
        required: false
        default: ""

jobs:
  run:
    # A reusable workflow may not request more GITHUB_TOKEN scopes than its
    # caller grants; the repo default is read-only, so grant the core's needs
    # here (contents: read / issues: write / id-token: write) explicitly.
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/_claude-scan.yml
    with:
      scan_name: deps
      max_issues: ${{ fromJSON(github.event.inputs.max_issues || '5') }}
      priority: P2
      # Plumbing only — the ceiling lives in the core's gate job. No fromJSON:
      # an empty string must survive as "use the default". See scan-todo.yml.
      backlog_ceiling: ${{ github.event.inputs.backlog_ceiling || '' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
