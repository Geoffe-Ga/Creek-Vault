name: Ralph Tooling Tests

# The ONE workflow for everything under scripts/ralph/ — the Discord recap's
# Python unit tests AND the shell suites for the fleet mechanics (fleet.sh,
# pick-next.sh, pr-ready.sh, watch-pr.sh, main-health.sh, review-quota.sh, plus
# the exec-bit regression test).
# These scripts live outside backend/ and tests/, so the backend-scoped
# lint/coverage gates don't cover them. Consolidated from the former
# ralph-fleet-tests.yml + ralph-recap-tests.yml pair: both triggered on the
# same `scripts/ralph/**` paths, so the split was two workflows pretending to
# be two concerns while covering one directory (#1096 fix 3).

on:
  push:
    paths:
      - "scripts/ralph/**"
      - ".github/workflows/ralph-recap-tests.yml"
  pull_request:
    paths:
      - "scripts/ralph/**"
      - ".github/workflows/ralph-recap-tests.yml"

permissions:
  contents: read

jobs:
  ralph-tooling-tests:
    name: Recap + fleet + watch tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # These scripts are the merge gate, and nothing else in CI lints them:
      # creek-tools/scripts/lint-extended.sh only shellchecks `scripts/*.sh`
      # relative to creek-tools/, so `scripts/ralph/*.sh` was covered by the
      # pre-commit hook alone — i.e. not at all for anyone who bypassed it.
      # `--severity=warning` matches the bar these files are written to.
      - name: Shellcheck the ralph scripts
        run: shellcheck --severity=warning scripts/ralph/*.sh

      - name: Run fleet + picker + pr-ready + watch-pr + exec-bit shell tests
        # Every suite is listed explicitly rather than globbed: a suite that is
        # written but never wired in here is not a gate, it is a file. test_main_health.sh
        # (issue #1159) guards the `main` CI circuit breaker the relaxed
        # pre-merge freshness gate depends on. test_review_quota.sh (issue #1160)
        # guards the reviewer-availability probe that stops a sync from spending
        # an LGTM the quota cannot replace — and its polarity is INVERTED with
        # respect to main-health.sh's, which is exactly the property an
        # unwired suite would stop pinning.
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          bash scripts/ralph/test_fleet.sh
          bash scripts/ralph/test_pick_next.sh
          bash scripts/ralph/test_pr_ready.sh
          bash scripts/ralph/test_watch_pr.sh
          bash scripts/ralph/test_main_health.sh
          bash scripts/ralph/test_review_quota.sh
          bash scripts/ralph/test_exec_bits.sh

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run recap tests
        run: python -m pytest scripts/ralph -q
