name: Ralph Tooling Tests

# The ONE workflow for everything under scripts/ralph/ — the Discord recap's
# Python unit tests AND the shell suites for the fleet mechanics (fleet.sh,
# pick-next.sh, pr-ready.sh, watch-pr.sh, main-health.sh, review-quota.sh, plus
# the exec-bit regression test).
# These scripts live outside backend/ and tests/, so the backend-scoped
# lint/coverage gates don't cover them. Consolidated from the former
# ralph-fleet-tests.yml + ralph-recap-tests.yml pair: both triggered on the
# same `scripts/ralph/**` paths, so the split was two workflows pretending to
# be two concerns while covering one directory (#1096 fix 3).

# code-review.yml is in BOTH path lists for the same reason every suite below is
# listed explicitly: a suite that is written but never wired in here is not a
# gate, it is a file. test_pr_ready.sh's coupling cases (issue #1181) read that
# workflow — the EMITTER of the `<!-- creek-review pr=N -->` provenance marker —
# and round-trip its printf format through pr-ready.sh's parser. Filtering on
# `scripts/ralph/**` alone meant a PR that edits only the emitter ran no coupling
# check at all: precisely the one change class those cases exist to guard. Both
# triggers, because a `push`-only filter still lets the drift land through a PR
# and a `pull_request`-only filter misses a direct push to `main`.
#
# iteration-trigger.yml is here for the identical reason: it is the SECOND
# merge-clearance path. It posts "You are cleared to squash merge" off its own
# verdict parse, so it must enforce the same invariant as pr-ready.sh or it
# becomes a code path that falsifies the first — and it cleared PR #1117 on
# #1179's verdict too. test_pr_ready.sh asserts two literals lifted out of it:
# the anchored marker ERE its `MARKER_PR` extraction greps with, and the
# `[ "$MARKER_PR" != "$PR" ]` clearance guard that consults it (extracting a
# marker and never reading it is the same bug with an extra step). Both
# assertions are as coupled to that file as the round trip is to the emitter, so
# a PR that edits only iteration-trigger.yml must run this suite as well.
#
# creek-tools/scripts/pr-status.sh is here because test_pr_status.sh is a suite
# whose SUBJECT lives outside scripts/ralph/. Every other suite tests a sibling,
# so `scripts/ralph/**` alone happened to cover both the test and the thing it
# tests; pr-status.sh breaks that coincidence. Without this path a change to the
# script under test — the job-name-agnostic CI parser the fleet reads its verdict
# from — would run no suite at all, which is the unwired-gate failure in its
# other direction: the suite exists and is listed, and still never sees the diff
# that could break it. tests/test_ralph_tooling_workflow.py derives this rule
# from the filesystem (suite `test_<x>.sh` → script `<x>.sh`) rather than from a
# list, so the next out-of-tree subject cannot be forgotten here.
#
# .claude/skills/await-claude-review/SKILL.md is the third file here, and it is
# the CONSUMER half of that same merge contract (#1202). Its Step 4a decides the
# merge from `**VERDICT**` + `**CI**` alone, so iteration-trigger.yml's refusal
# vocabulary — `HELD`, `NOT ATTESTED`, `NOT CURRENT` — only means anything if
# Step 4a refuses those values; test_pr_ready.sh reads the emitter's branches and
# asserts SKILL.md names every one. Emitter and consumer are two files agreeing
# in prose, which is exactly what drifted to produce #1202, so a PR that edits
# either one alone has to run the suite that compares them.
#
# .claude/skills/address-feedback/SKILL.md joins them for #1199, and it was the
# gap the same argument had already been made about twice: the suite asserts that
# BOTH merge-clearance skills name every login pr-ready.sh's verdict-author
# allowlist admits (an agent told to find "the review" by author is deciding the
# same question the gate decides, on the same thread, and its answer feeds a
# merge) — but only await-claude-review was watched here. So that assertion could
# have been falsified by a one-line edit to the unwatched file with CI green,
# which is the unwired-gate failure these two `paths:` lists exist to prevent.
on:
  push:
    paths:
      - "scripts/ralph/**"
      - "creek-tools/scripts/pr-status.sh"
      - ".github/workflows/ralph-recap-tests.yml"
      - ".github/workflows/code-review.yml"
      - ".github/workflows/iteration-trigger.yml"
      - ".claude/skills/await-claude-review/SKILL.md"
      - ".claude/skills/address-feedback/SKILL.md"
  pull_request:
    paths:
      - "scripts/ralph/**"
      - "creek-tools/scripts/pr-status.sh"
      - ".github/workflows/ralph-recap-tests.yml"
      - ".github/workflows/code-review.yml"
      - ".github/workflows/iteration-trigger.yml"
      - ".claude/skills/await-claude-review/SKILL.md"
      - ".claude/skills/address-feedback/SKILL.md"

permissions:
  contents: read

jobs:
  ralph-tooling-tests:
    name: Recap + fleet + watch tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # These scripts are the merge gate, and nothing else in CI lints them:
      # creek-tools/scripts/lint-extended.sh only shellchecks `scripts/*.sh`
      # relative to creek-tools/, so `scripts/ralph/*.sh` was covered by the
      # pre-commit hook alone — i.e. not at all for anyone who bypassed it.
      # `--severity=warning` matches the bar these files are written to.
      - name: Shellcheck the ralph scripts
        run: shellcheck --severity=warning scripts/ralph/*.sh

      - name: Run fleet + picker + pr-ready + watch-pr + exec-bit shell tests
        # Every suite is listed explicitly rather than globbed: a suite that is
        # written but never wired in here is not a gate, it is a file. test_main_health.sh
        # (issue #1159) guards the `main` CI circuit breaker the relaxed
        # pre-merge freshness gate depends on. test_review_quota.sh (issue #1160)
        # guards the reviewer-availability probe that stops a sync from spending
        # an LGTM the quota cannot replace — and its polarity is INVERTED with
        # respect to main-health.sh's, which is exactly the property an
        # unwired suite would stop pinning. test_pr_status.sh (issue #1141)
        # guards the ONE reader the fleet asks "is this PR green?" — its cases
        # assert that pr-status.sh, watch-pr.sh and pr-ready.sh name no CI job,
        # so a rename inside ci.yml cannot silently turn the loop's verdict
        # blind. "Listed explicitly" is only a rule if a new suite must join the
        # list to merge, so tests/test_ralph_tooling_workflow.py derives the
        # expected set from `scripts/ralph/test_*.sh` on disk and fails on any
        # suite this block omits.
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          bash scripts/ralph/test_fleet.sh
          bash scripts/ralph/test_pick_next.sh
          bash scripts/ralph/test_pr_ready.sh
          bash scripts/ralph/test_pr_status.sh
          bash scripts/ralph/test_watch_pr.sh
          bash scripts/ralph/test_main_health.sh
          bash scripts/ralph/test_review_quota.sh
          bash scripts/ralph/test_exec_bits.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run recap tests
        run: python -m pytest scripts/ralph -q
