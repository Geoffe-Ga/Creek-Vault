name: Claude Scan (reusable)

# Reusable core for the autonomous maintenance pipeline. Each maintenance
# scan (todo, deps, security, perf, …) is a ~20-line thin wrapper that calls
# this workflow with a `scan_name`, a `priority`, and a `max_issues` cap. The
# scan reads `prompts/scans/<scan_name>.md`, runs its read-only analysis, and
# uses the `scan-issue-writer` skill to file deduplicated, 6-component,
# agent-ready GitHub issues for the Ralph loop to consume.
#
# This mirrors the de-slop workflow's plumbing (auth, runner, permissions)
# deliberately — see `.github/workflows/deslop.yml`. Scans NEVER push code:
# the GITHUB_TOKEN is `contents: read` / `issues: write`, so the only durable
# output is new issues. Code changes remain the Ralph loop's job.
#
# BACKLOG CEILING (issue #1516). Every run starts with a `gate` job that runs
# `scripts/ralph/backlog-gate.sh` and measures how deep the `agent-ready` queue
# already is. Above the shared ceiling the `scan` job is skipped, because past
# the cap new issues go stale before anyone can work them — filing more is
# landfill, not throughput. Before this, the ONLY depth check in the repo lived
# inside `hopper.yml`, i.e. on the one path that fires when the queue is
# *starving*; the eleven scheduled producers that route through this core had
# none, and the backlog reached 158 against a "max 80" guard. The ceiling
# itself is stated once, in that script, so this core and hopper cannot drift
# apart. `backlog_ceiling` raises it for a single deliberate catch-up run.
#
# CITATION BACKSTOP (issue #1700). `verify-scan-citations.sh` (#1651) resolves
# every cited symbol against the scan SHA, but until now it ran ONLY because
# the `prompt:` below asks the agent to run it. The agent holds `Bash`,
# `issues: write` and a `--max-turns 40` budget it can exhaust AFTER
# `gh issue create` and BEFORE the verification — so a phantom was blocked
# when the agent complied, not made unrepresentable, and nothing downstream
# re-read what was filed. Two steps close that: a snapshot of the label's
# existing issues taken BEFORE the agent runs, and an `if: always()` step
# AFTER it that re-reads the issues this run actually filed and pipes their
# own `File(s):`/`Symbol(s):` citations back through the same verifier. The
# prompt sentence stays as defence in depth: a rejected citation should never
# be filed in the first place, and the backstop is what catches it when it is.
#
# Required configuration:
#   secret  CLAUDE_CODE_OAUTH_TOKEN  - same token the other Claude workflows use.

on:
  workflow_call:
    inputs:
      scan_name:
        description: "Scan id — must match prompts/scans/<scan_name>.md (e.g. 'todo', 'perf')."
        required: true
        type: string
      max_issues:
        description: "Hard cap on issues created this run. The hopper controls volume."
        required: false
        type: number
        default: 5
      priority:
        description: "Priority label applied to filed issues: P0 | P1 | P2 | P3."
        required: true
        type: string
      backlog_ceiling:
        description: "Override the shared agent-ready backlog ceiling for this run. Blank = the default in scripts/ralph/backlog-gate.sh."
        required: false
        type: string
        default: ""
      enforce_backlog_ceiling:
        description: "Whether a full backlog suppresses this scan. Default true. Only scan-security.yml sets false — see its header for the operator decision."
        required: false
        type: boolean
        # Gating is the DEFAULT and exemption is opt-in. Inverting this
        # would silently un-throttle the ten wrappers that never mention
        # it, and no allowlist test would notice, because nobody would
        # have declared anything. tests/test_backlog_ceiling_gate.py pins
        # this value for exactly that reason.
        default: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  issues: write
  # OIDC token for the claude action's auth exchange (mirrors claude.yml / deslop.yml).
  id-token: write

# One scan at a time per scan type: never kill a run mid-issue-creation, and
# never let a scheduled run race a hopper-dispatched run of the same scan.
concurrency:
  group: claude-scan-${{ inputs.scan_name }}
  cancel-in-progress: false

jobs:
  # Measure first, produce second. This job is cheap (one checkout, one `gh`
  # query) and short, so the throttle costs a minute rather than a scan.
  gate:
    name: "Backlog ceiling"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Narrower than the workflow-level grant below: this job only reads a file
    # and counts issues, so it gets no `issues: write` and no `id-token`. Note
    # `issues: read` is required, not optional — dropping to `contents: read`
    # alone makes the `gh issue list` inside backlog-gate.sh 403, which would
    # exit 1 and redden every scheduled scan.
    permissions:
      contents: read
      issues: read
    outputs:
      proceed: ${{ steps.backlog_gate.outputs.proceed }}
    steps:
      - name: Checkout repository (the gate script only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Measure the agent-ready backlog against the shared ceiling
        id: backlog_gate
        env:
          GH_TOKEN: ${{ github.token }}
          # The override crosses from a workflow_dispatch input into a shell,
          # so it arrives as DATA in the environment and is never interpolated
          # into the `run:` body — a `${{ … }}` there is substituted into the
          # shell SOURCE before bash ever sees it, which is the injection class
          # the `scan_name` charset guard below exists for. The script
          # allowlists it before use.
          BACKLOG_CEILING: ${{ inputs.backlog_ceiling }}
        run: scripts/ralph/backlog-gate.sh

      # The measurement above runs for exempt scans too — knowing the depth
      # is useful even when it does not gate — but a summary that says
      # "standing down" beside a scan that then runs anyway is a lie the
      # next reader has to debug. So say plainly which of the two it was.
      - name: Note that this scan is exempt from enforcement
        if: inputs.enforce_backlog_ceiling == false
        run: |
          set -euo pipefail
          printf '%s\n' "This scan is EXEMPT from backlog-ceiling enforcement (see its wrapper for the operator decision); the measurement above is informational and does not suppress it." \
            | tee -a "$GITHUB_STEP_SUMMARY"

  scan:
    name: "Scan ${{ inputs.scan_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gate
    # JOB-level, deliberately, not a per-step `if:`. A step-level guard has to
    # be remembered by whoever adds the fourth step; a job-level one makes an
    # ungated step structurally impossible. A skipped job also leaves the run's
    # overall conclusion `success`, so a nightly stand-down is green — a
    # workflow that goes red every night is a workflow everyone learns to
    # ignore.
    #
    # Two clauses, and the ORDER of the reading matters: a caller may switch
    # enforcement off (only scan-security.yml does — operator decision at a
    # measured 163 agent-ready against a ceiling of 90, where gating would have
    # suppressed CVE and injection findings until the backlog fell by 73), but
    # it cannot switch off the MEASUREMENT: the gate job still runs, still
    # reports the depth, and the exempt scan still honours its own max_issues
    # cap. Exempt from the throttle is not exempt from the pipeline.
    if: inputs.enforce_backlog_ceiling == false || needs.gate.outputs.proceed == 'true'
    steps:
      - name: Checkout repository (recent history for churn/bug analysis)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 50

      - name: Validate scan_name and locate its definition
        env:
          SCAN_NAME: ${{ inputs.scan_name }}
        run: |
          set -euo pipefail
          # Charset guard: scan_name is interpolated into a file path and the
          # Claude prompt. GitHub Actions inputs have no `pattern:` field, so we
          # fail fast here instead. Blocks path-traversal / injection from any
          # future wrapper that wires scan_name to a workflow_dispatch input.
          if ! printf '%s' "$SCAN_NAME" | grep -qE '^[a-z][a-z0-9-]+$'; then
            echo "::error::Invalid scan_name '$SCAN_NAME' — must match ^[a-z][a-z0-9-]+$"
            exit 1
          fi
          if [ ! -f "prompts/scans/$SCAN_NAME.md" ]; then
            echo "::error::No scan definition at prompts/scans/$SCAN_NAME.md"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install analyzer toolbox (read-only analyzers)
        # Mirrors ci.yml's locked-uv flow: install the fully-pinned uv.lock
        # straight into the runner's Python so every analyzer (radon, xenon,
        # vulture, pip-audit, bandit, interrogate, mypy, ruff, …) resolves
        # exactly as CI does. `uv export --locked` fails if uv.lock drifted.
        working-directory: creek-tools
        run: |
          python -m pip install 'uv==0.11.16'
          uv export --locked --all-extras --no-emit-project --no-hashes \
            -o /tmp/locked-requirements.txt
          uv pip install --system -r /tmp/locked-requirements.txt
          uv pip install --system --no-deps -e .
          # mutmut is not a repo dependency (mutation scan only) — install it
          # ad hoc. A failure here must not sink a scan that does not use it,
          # but it must be VISIBLE, not silent, so a scan that expected the
          # tool and found it missing reports "tooling broken" (skill
          # Troubleshooting) rather than a false "clean" result.
          uv pip install --system mutmut || true
          for tool in pip-audit vulture mutmut; do
            uv pip show --system "$tool" >/dev/null 2>&1 \
              || echo "::warning::optional analyzer '$tool' is not installed; scans that rely on it should fail loudly, not report clean"
          done

      # The BASELINE for the post-agent backstop. Taken before the agent runs,
      # so "what this run filed" is a set difference over issue numbers rather
      # than a question anyone has to ask the agent.
      - name: Snapshot the scan issues that already exist
        id: filed_issues
        env:
          GH_TOKEN: ${{ github.token }}
          # DATA, not shell source — same discipline as BACKLOG_CEILING above.
          SCAN_LABEL: "scan:${{ inputs.scan_name }}"
        run: |
          set -uo pipefail
          # NOT `--search "created:>=<run start>"`. That path goes through
          # GitHub's SEARCH INDEX, which lags issue creation by seconds to
          # minutes — so an issue filed moments ago by the very run being
          # checked is the document most likely to be missing from it. The
          # backstop would then enumerate ZERO issues, verify nothing and
          # exit 0: a gate reporting that it did nothing, indistinguishable
          # from a clean pass. `gh issue list --label` is the REST issues
          # listing and has no such lag.
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          before=""
          ok=false
          if before="$(gh issue list --repo "$GITHUB_REPOSITORY" \
              --label "$SCAN_LABEL" --state all --limit 200 \
              --json number --jq '[.[].number] | join(",")')"; then
            ok=true
          else
            echo "::warning::could not snapshot '$SCAN_LABEL' issues; the post-run backstop will fail closed"
          fi
          # The backstop checks its OWN listing for truncation, but that is a
          # separate query and this one must check itself too. A label that
          # ever reached the limit would otherwise hand the backstop a
          # silently short baseline, and every issue missing from it would
          # look newly filed — which is how an automated correction comment
          # lands on somebody else's issue.
          if [ "$ok" = "true" ]; then
            snapshot_count=$(printf '%s' "$before" | tr ',' '\n' | grep -c '[0-9]' || true)
            if [ "${snapshot_count:-0}" -ge 200 ]; then
              ok=false
              echo "::warning::the '$SCAN_LABEL' snapshot returned $snapshot_count issues at --limit 200 and may be truncated; the backstop will fail closed rather than treat pre-existing issues as newly filed"
            fi
          fi
          # Always written, even on failure: the backstop reads `ok` and
          # refuses to run without a baseline, which is a louder and more
          # honest signal than a step that dies before recording anything.
          {
            printf 'before=%s\n' "$before"
            printf 'started_at=%s\n' "$started_at"
            printf 'ok=%s\n' "$ok"
          } >>"$GITHUB_OUTPUT"

      - name: Run Claude scan
        uses: anthropics/claude-code-action@24dcd50c0568f0fc9e9211213a4fd2d9eb15c4e0  # v1.0.200
        env:
          # The scan-issue-writer skill files issues via gh; the action injects
          # GITHUB_TOKEN, but gh reads GH_TOKEN — bind it to the job token whose
          # scope is contents:read / issues:write.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Surface the transcript in the run log so the scan is auditable: you
          # can verify the skill was invoked and the cap respected. Safe on a
          # private repo with read-only contents.
          show_full_output: true

          # --model opus: issue authoring is judgment-heavy (severity ranking,
          #   dedupe decisions, 6-component prose). The action default (Sonnet)
          #   files vaguer issues.
          # --max-turns 40: one scan, bounded analysis + a capped set of creates.
          claude_args: >-
            --allowed-tools "Bash,Read,Grep,Glob,Write,Skill,Task"
            --model opus
            --max-turns 40

          prompt: |
            Use the `scan-issue-writer` skill and follow its instructions exactly.

            Scan type: ${{ inputs.scan_name }}
            Scan definition file: prompts/scans/${{ inputs.scan_name }}.md
            Max issues to create this run: ${{ inputs.max_issues }}
            Priority label for filed issues: ${{ inputs.priority }}

            Read the scan definition first. Run its read-only analysis, rank and
            cap the findings, dedupe against open issues before every create,
            and file each surviving finding as a fully-populated 6-component
            issue. A clean scan that files ZERO issues is a valid success — do
            not invent work. End with the run summary the skill specifies,
            appended to $GITHUB_STEP_SUMMARY.

            MANDATORY, before any `gh issue create` (#1651): every finding that
            names a code symbol must declare it in a `symbol` (or `symbols`)
            field, and you must verify it by piping the findings as
            newline-delimited JSON through:

                SCAN_SHA=$GITHUB_SHA creek-tools/scripts/verify-scan-citations.sh

            That script exits non-zero and names each phantom. A citation it
            rejects MUST NOT be filed: re-resolve the symbol against the scan
            SHA and cite the real name, or drop the symbol from the finding.
            Do not paraphrase a name from surrounding code — that is exactly
            the failure this gate exists to stop.

            Note that this is no longer the only check: a `run:` step after
            this one re-reads every issue you file and re-verifies its
            citations independently (#1700). Skipping the pre-create run does
            not hide a phantom, it just turns a fixable draft into a red run
            and a correction comment on a filed issue.

      # THE BACKSTOP (#1700). Asks the agent for nothing: it re-reads the
      # issues this run actually filed and re-verifies their citations.
      #
      # `if: always()`, with NO `steps.*.conclusion` clause. The agent step
      # failing — after it has already created issues — is precisely the
      # scenario this exists for, and so is a failed snapshot: gating on
      # either would skip the check exactly when it is needed and leave the
      # job green with zero citations verified. The script fails closed on a
      # missing baseline instead.
      - name: Re-verify the citations this run filed (independent of the agent)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_LABEL: "scan:${{ inputs.scan_name }}"
          ISSUES_BEFORE: ${{ steps.filed_issues.outputs.before }}
          ISSUES_SNAPSHOT_OK: ${{ steps.filed_issues.outputs.ok }}
          RUN_STARTED_AT: ${{ steps.filed_issues.outputs.started_at }}
          # DATA in the environment. A `${{ … }}` in the `run:` body is
          # substituted into the shell SOURCE before bash ever sees it, which
          # is the injection class the scan_name charset guard above exists
          # for; the run body below is therefore one bare token.
          SCAN_SHA: ${{ github.sha }}
        run: creek-tools/scripts/recheck-filed-scan-citations.sh
