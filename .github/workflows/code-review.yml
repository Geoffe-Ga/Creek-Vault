name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"
  # RE-REVIEW WITHOUT MANUFACTURING A PUSH (#1201). Before this trigger the only
  # way to obtain a fresh verdict was to produce one of the four activity types
  # above, which in practice meant an empty commit: a full CI round (~14 min)
  # AND — because every push invalidates the previous verdict under
  # `scripts/ralph/pr-ready.sh`'s stale-verdict guard — the very act that
  # destroys the review the lane was waiting on. `gh run rerun` is not a
  # substitute: it replays the workflow file from the commit the original run
  # was launched from, so it cannot exercise a fixed workflow.
  #
  # THIS WIDENS NOTHING. `workflow_dispatch` is write-gated by GitHub, so only
  # an account that could already push can fire it. What it buys that no push
  # can is the `ready-unreviewed` un-wedge: the `if:` on the job below skips
  # runs whose ACTOR is Dependabot, because GitHub withholds
  # CLAUDE_CODE_OAUTH_TOKEN from those. Secrets ARE available on a dispatch and
  # `github.actor` is the dispatching human, so this is the one path on which a
  # bot PR can earn a real verdict.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "The pull request to review (required — a dispatched run has no event payload to derive it from)."
        required: true
        type: string

# ONE REVIEW IN FLIGHT PER PR, whatever triggered it.
#
# The group used to be keyed on `github.ref`, which was correct while
# `pull_request` was the only trigger and is wrong the moment a second one
# exists: `github.ref` on a dispatch is the dispatched ref (`refs/heads/main`),
# never `refs/pull/N/merge`. A ref-keyed group therefore puts the manual run in
# a DIFFERENT group from the automatic one — neither cancels the other, and both
# post a verdict comment onto the same thread.
#
# `env.PR_NUMBER` (the single resolution point below) is NOT in scope in a
# `concurrency:` block, so the fallback is spelled out a second time here. That
# is the only duplication of this expression the file allows, and
# `creek-tools/tests/test_code_review_workflow.py` counts the greppable form to
# keep it that way.
#
# Why it matters: every push to a lane invalidates the previous LGTM under
# pr-ready.sh's stale-verdict guard, so a superseded review is not merely
# wasted Claude time — its verdict can never gate anything. Letting it run to
# completion also posts a verdict comment against an already-dead HEAD, which
# is noise on the very PR thread a human reads to see what happened (#1140).
#
# `cancel-in-progress` stays keyed on the event: a dispatch is a deliberate
# human request for a verdict on a head nobody just moved, so it neither
# cancels nor is cancelled — it queues behind whatever is running for that PR.
# Note the deliberate divergence from ci.yml, which is ref-keyed and already has
# a `workflow_dispatch`: that workflow posts no verdict comment, so two
# concurrent runs there cost compute and nothing else.
concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  claude-review:
    # Skip runs Dependabot itself TRIGGERED — keyed on the actor, not the PR's
    # author. GitHub withholds Actions secrets (incl. CLAUDE_CODE_OAUTH_TOKEN)
    # from a run whose ACTOR is Dependabot, so the action would hard-fail before
    # reviewing and block the PR's check. That withholding has never been about
    # who OPENED the PR — and a PR's author stays `dependabot[bot]` forever, no
    # matter who pushes to it. Keying the skip there suppressed the review
    # permanently on every bot PR, including the `synchronize` runs we trigger
    # ourselves, where the secrets ARE available. The result was a deadlock, not
    # a gate: no verdict could ever be posted, so `scripts/ralph/pr-ready.sh`
    # could never print `ready` for a bump. Once one of our commits lands on the
    # branch the synchronize run is ours and the bump gets a real review; a bump
    # nobody touched still skips, and `pr-ready.sh` reports that distinctly as
    # `ready-unreviewed` rather than waiting forever.
    #
    # ON A DISPATCH THIS GUARD IS TRIVIALLY TRUE, and that is the point rather
    # than a hole (#1201): `github.actor` on a `workflow_dispatch` is the human
    # who fired it, and the secrets GitHub withholds from a Dependabot-actor run
    # ARE present. So the guard still suppresses exactly the runs that would
    # hard-fail for want of a token, while a human who wants a bot PR reviewed
    # can ask for one — which is the `ready-unreviewed` un-wedge, not a widening.
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    # THE ONE PLACE THE PR NUMBER IS RESOLVED (#1201). Five copies of the bare
    # `github.event.pull_request.number` interpolation used to be spread across
    # the prompt and the Post-review step, and every one of them resolves to the
    # EMPTY STRING under `workflow_dispatch`: the prompt would read "pull request
    # #" and the `reviewed_pr_number` cross-check would compare against an empty
    # `$PR_NUMBER` and `exit 1` — a silent, review-shaped nothing rather than an
    # obvious break.
    #
    # TWO ADJACENT EXPRESSIONS RATHER THAN `a || b`, on purpose. Exactly one of
    # the two contexts is ever populated — a `pull_request` run has no `inputs`,
    # a `workflow_dispatch` run has no `event.pull_request` — so concatenation
    # yields the populated one, and the empty string when neither exists, which
    # is what `||` would give too. What it buys over `||` is that the bare
    # interpolation survives intact and countable:
    # `creek-tools/tests/test_code_review_workflow.py` asserts that spelling
    # appears in this file EXACTLY ONCE, so a reintroduced bare copy at any
    # consumer goes red on the PR that adds it, instead of quietly emptying that
    # consumer on every dispatch.
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}${{ inputs.pr_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # PIN THE MERGE REF (#1201). On `pull_request` this is what GitHub
          # already checks out, so it is a no-op there. On a dispatch it is the
          # difference between reviewing the PR and reviewing whatever branch
          # the run was fired from — and the prompt below asserts the checkout
          # is `refs/pull/<N>/merge` unconditionally, so leaving it implicit
          # would make this workflow lie to the model. A closed or conflicted
          # PR has no `/merge` ref and this step fails loudly, which is the
          # right outcome: no review is better than a review of `main`.
          ref: refs/pull/${{ env.PR_NUMBER }}/merge
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@24dcd50c0568f0fc9e9211213a4fd2d9eb15c4e0  # v1.0.200
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"
          show_full_output: true
          # THE PR NUMBER IS STATED HERE BECAUSE THE AGENT CANNOT DERIVE IT
          # (#1181). `actions/checkout` above checks out `refs/pull/<N>/merge` in
          # DETACHED HEAD, so `gh pr view --json number` — the agent's natural
          # first move — fails with "could not determine current branch: failed
          # to run git: not on any branch". On PR #1117 it then guessed via
          # `gh pr list`, matched the merge ref's base parent to PR #1179's
          # `mergeCommit.oid`, reviewed that bump's diff, and this workflow
          # posted the resulting LGTM onto #1117. There is NO diff range anywhere
          # in this file: the defect was PR-number RESOLUTION, not range
          # selection, and a "fix" to a range would change nothing.
          #
          # INTERPOLATION SAFETY: `github.event.pull_request.number` is an
          # integer and `github.repository` is `owner/repo` over GitHub's own
          # name charset. Neither is attacker-controlled free text the way
          # `title` / `body` / branch names are, so splicing them into the prompt
          # adds no injection surface.
          #
          # AND THE USUAL `env:` + `$VAR` HARDENING DOES NOT APPLY HERE. `prompt`
          # is an ACTION INPUT, not a shell script: nothing expands `$VAR` on the
          # way in, so an `env:` indirection would ship the literal characters
          # `$PR_NUMBER` to the model and silently restore the bug this whole
          # change exists to fix. Do not "harden" it that way.
          #
          # `${{ env.PR_NUMBER }}` BELOW IS A DIFFERENT MECHANISM WITH THE SAME
          # BYTES, and the paragraph above is not an argument against it (#1201).
          # The shell form `$PR_NUMBER` is dead text here because nothing in this
          # path runs a shell; `${{ env.PR_NUMBER }}` is an Actions EXPRESSION,
          # evaluated by the runner BEFORE the input is handed to the action, so
          # the model receives the resolved integer exactly as it did when the
          # event field was spliced in directly. What changes is that the value
          # now also resolves on a `workflow_dispatch`, where
          # `github.event.pull_request.number` is empty.
          prompt:  |
            You are reviewing pull request #${{ env.PR_NUMBER }}
            of the repository ${{ github.repository }}.

            THAT NUMBER IS AUTHORITATIVE. It is the PR this review will be posted
            to, and it is the only PR you may review. Do not try to work out
            which PR you are on: the checkout is `refs/pull/${{ env.PR_NUMBER }}/merge`
            in detached HEAD, so a bare `gh pr view` or `gh pr diff` WILL fail
            with "could not determine current branch: failed to run git: not on
            any branch". That failure is expected — it is not a reason to search.

            NEVER infer the pull request from `git log`, from a merge commit's
            parent OID, or by listing pull requests. Pass the number and the
            repository explicitly on every `gh` call:

              gh pr diff ${{ env.PR_NUMBER }} -R ${{ github.repository }}
              gh pr view ${{ env.PR_NUMBER }} -R ${{ github.repository }}

            Review this pull request against the repository's CLAUDE.md. Read the
            change with those commands (and any files you need).

            Do NOT post a comment yourself. Return ONLY the structured result with
            four fields:

            - "review_markdown": the full review as GitHub markdown, using this
              template (omit the verdict here — it is a separate field below):

              ## Summary
              Brief overview (2-3 sentences)
              ## Strengths
              What's done well?
              ## Security Concerns
              Vulnerabilities? 🔴 BLOCKING | 🟡 HIGH | 🟢 LOW
              ## Problems
              Critical issues blocking merge (mark 🔴)
              ## Code Quality
              Non-blocking improvements (these are COMMENTS, not blockers)
              ## CLAUDE.md Adherence
              ✅/❌ Coverage, linting, types, patterns, commits
              ## Testing
              Test quality (insufficient testing is BLOCKING)
              ## Documentation
              Docs completeness

            - "verdict": exactly one of CHANGES_REQUESTED, COMMENTS, LGTM. Take a
              clear stance — do NOT default to COMMENTS as a safe middle ground.
              Reason about it like this:

                1. Is there ANY blocking problem? A real bug, a 🔴 security issue,
                   insufficient/missing tests, or a CLAUDE.md violation that must
                   be fixed before merge → CHANGES_REQUESTED.
                2. Otherwise, would you merge this as-is right now? If the only
                   remarks are nits you would not block on (or there is nothing to
                   note), say so → LGTM. Minor style nits do NOT downgrade an
                   otherwise-mergeable PR.
                3. Reserve COMMENTS for the genuine middle: nothing blocks merge,
                   but there ARE substantive non-blocking suggestions the author
                   should weigh first. If you reach for COMMENTS, name the specific
                   suggestion that keeps it out of LGTM — if you can't, it's LGTM.

            - "verdict_rationale": one or two sentences justifying the verdict,
              required for ALL THREE outcomes. For CHANGES_REQUESTED, name the
              blocking issue(s). For COMMENTS, name the substantive suggestion(s)
              that kept it from LGTM. For LGTM, state why it is ready to merge.

            - "reviewed_pr_number": the integer you actually passed to
              `gh pr diff` — copy it from your own command, not from the
              instructions above. It is a report of what you DID, not an echo of
              what you were told; the workflow compares it with the PR it is
              about to comment on and discards the whole review if they differ.

          # The --json-schema flag makes the action return a validated
          # ``structured_output`` JSON string (verdict + rationale +
          # review_markdown + reviewed_pr_number) instead of relying on the agent
          # to remember to post a comment — the "Post review" step below then
          # posts it deterministically (fixes flaky success-with-no-comment
          # runs). gh pr comment is intentionally NOT in allowed-tools so the
          # agent cannot post on its own.
          #
          # `reviewed_pr_number` is in BOTH `required` and `properties`, with
          # `additionalProperties:false` kept: `required` without `properties`
          # validates nothing, and `properties` without `required` makes it
          # optional — so an agent that cannot work out which PR it read would
          # simply omit it, which is precisely the #1117 failure. It must be a
          # hard schema violation instead.
          #
          # `Bash(gh pr list:*)` IS GONE, and its absence is worth keeping — but
          # it is DEFENCE IN DEPTH, NOT A PROOF, and must never be cited as one.
          # `gh pr list --state all --json number,title,headRefName,mergeCommit,commits`
          # is literally the command the #1117 run used to guess its way to the
          # wrong PR, so removing it takes away the specific instrument of that
          # incident and raises the bar for the next accident. It does NOT remove
          # the CAPABILITY: `gh search prs --repo owner/repo --json number`
          # enumerates pull requests just as well. Anyone who reads this list as
          # "the agent cannot enumerate, therefore it cannot guess" has the
          # security story backwards.
          #
          # `Bash(gh search:*)` STAYS anyway, deliberately. Nothing in the prompt
          # above asks the reviewer to search — but a reviewer that cannot look up
          # a related issue or a prior PR writes worse reviews, and taking a
          # capability away buys nothing here once the real control below is in
          # place. A review-quality regression traded for a non-guarantee is a bad
          # trade.
          #
          # THE ACTUAL CONTROL IS THE WORKFLOW-SIDE `reviewed_pr_number`
          # CROSS-CHECK in the "Post review" step: the agent reports the number it
          # actually passed to `gh pr diff`, this workflow compares it with
          # `$PR_NUMBER`, and a mismatch discards the review, posts no comment and
          # fails the check. That check does not care HOW the agent arrived at a
          # number, so it holds even against one that enumerated by some route
          # nobody anticipated — which is exactly why it, and not this list, is
          # the gate. `scripts/ralph/pr-ready.sh` leans on the same asymmetry: its
          # provenance marker attests only that a pipeline version running THIS
          # cross-check posted the verdict, so weakening the cross-check silently
          # empties every marker in the fleet while every test about the marker
          # stays green.
          claude_args: >-
            --model sonnet
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","verdict_rationale","review_markdown","reviewed_pr_number"],"properties":{"verdict":{"type":"string","enum":["CHANGES_REQUESTED","COMMENTS","LGTM"]},"verdict_rationale":{"type":"string"},"review_markdown":{"type":"string"},"reviewed_pr_number":{"type":"integer"}}}'
            --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Post review
        # Deterministic: this step always runs after a successful review and posts
        # the comment. If the action produced no structured output (a genuinely
        # failed/empty review), fail so the check is red and the review is
        # re-run — never a silent success with no review.
        env:
          # Prefer a real PAT with pull-requests:write (GEOFFE_GA_PAT — the same
          # one iteration-trigger.yml uses) so the verdict comment is authored by
          # an account any downstream webhook can recognize; fall back to
          # GITHUB_TOKEN (github-actions[bot]) if the PAT secret is absent. NOT
          # the action's Claude App github_token output — that 401s with gh.
          GH_TOKEN: ${{ secrets.GEOFFE_GA_PAT || secrets.GITHUB_TOKEN }}
          # PR_NUMBER is INHERITED from the job-level `env:` (#1201) rather than
          # re-derived here. Re-deriving it from the event payload is what made
          # this step's `reviewed_pr_number` cross-check compare against an empty
          # string on any non-`pull_request` trigger.
          REPO: ${{ github.repository }}
          STRUCTURED: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          set -euo pipefail
          if [ -z "${STRUCTURED:-}" ]; then
            # claude-code-action self-skips (anti-tamper) on any PR that edits this
            # workflow file, so there is no review to post — that is expected and
            # must not fail the check (the workflow change is reviewed manually).
            # Assign first, then grep a herestring: a `gh … | grep -q` PIPELINE
            # trips pipefail (grep -q exits on first match, gh dies with SIGPIPE
            # 141, and the pipeline reports non-zero on a MATCH). If gh itself
            # fails, set -e fails the step loudly — never a silent green.
            changed_files=$(gh pr diff "$PR_NUMBER" -R "$REPO" --name-only)
            if grep -qxF '.github/workflows/code-review.yml' <<<"$changed_files"; then
              # This is the workflow-edited self-skip path: the required check must
              # stay green (exit 0) so branch protection does not dead-lock, but a
              # missing review must be LOUD — not a silent no-op. Post an explicit
              # PR comment (in addition to the ::warning::) so it shows in the PR
              # timeline. The body is a fully STATIC string (no interpolation of any
              # PR-controlled data → no injection surface) and deliberately carries
              # NO "## Verdict:"/"**Verdict:**" line, so the merge-critical
              # line-anchored verdict parsers (iteration-trigger.yml, pr-ready.sh)
              # never mistake it for a real verdict. (The word "verdict" appears
              # mid-line only; a bare-substring analytics parser could still count
              # it — harmless recap noise, never a gate.)
              echo "::warning::This PR edits the review workflow, so the action self-skips — no automated verdict; review manually."
              # Idempotency: on `synchronize` this step re-runs per push, so dedup on
              # the stable HTML marker. jq does the containment test in one command
              # substitution (no `grep -q` pipeline → no SIGPIPE). Matching purely on
              # the marker (not the comment author) is the robust dedup choice; even
              # if someone pre-posts the marker to suppress the warning it is
              # harmless — there is still no verdict comment, so the PR stays
              # awaiting-review.
              marker_count=$(gh pr view "$PR_NUMBER" -R "$REPO" --json comments \
                --jq '[.comments[].body | select(. != null and contains("<!-- review-self-skip -->"))] | length')
              if [ "$marker_count" -eq 0 ]; then
                # Build the body from static literals via printf so the marker sits
                # on its own top line with no leading indentation (avoids markdown
                # treating an indented second line as a code block). No PR-controlled
                # data is interpolated, so there is no injection surface.
                self_skip_body=$(printf '%s\n%s\n' \
                  '<!-- review-self-skip -->' \
                  '⚠️ This PR edits the review workflow — no automated verdict; manual review required.')
                gh pr comment "$PR_NUMBER" -R "$REPO" --body "$self_skip_body"
              fi
              exit 0
            fi
            echo "::error::Claude review produced no structured output — failing so it is re-run, never a silent no-review."
            exit 1
          fi
          # --- THE CROSS-CHECK (#1181) --------------------------------------
          # Everything from here down runs only on the REAL review path; the
          # self-skip branch above returns at its own `exit 0` with no verdict
          # and no marker, and must keep doing so — it is the path taken by any
          # PR that edits this very file.
          #
          # The agent reports the number it actually passed to `gh pr diff`. If
          # that is not this PR, the review describes somebody else's code: it is
          # discarded, no comment is posted, and the check goes red.
          #
          # STRING comparison on purpose, and the `^[0-9]+$` guard is what makes
          # the reason narrow: an empty or lettered report is already refused by
          # the regex, so `0100` is the ONE surviving value where `-eq` and a
          # string `!=` disagree at all — and the two shells this repo runs under
          # disagree with EACH OTHER about it. Measured, not assumed:
          #
          #   bash 5.3.15                        [[ "0100" -eq 100 ]] → TRUE   -eq 64 → FALSE
          #   bash 3.2 (stock /bin/bash, macOS)  [[ "0100" -eq 100 ]] → FALSE  -eq 64 → TRUE
          #
          # (bash 5 reads the leading zero as decimal in `[[ ]]`'s arithmetic
          # context; bash 3.2 reads it as octal 64. The runner here is bash 5, so
          # the octal reading does NOT happen on CI — which is what makes a
          # numeric compare worse than merely wrong: it is shell-version-
          # dependent, with nothing in the output to say which reading ran.)
          # String equality is exact and version-independent, and it is the same
          # choice `pr-ready.sh` makes on the parser side of this contract, with
          # the same measurements recorded there and a `pr=0100` case pinning it
          # in `scripts/ralph/test_pr_ready.sh`.
          reviewed_pr=$(jq -r '.reviewed_pr_number // ""' <<<"$STRUCTURED")
          if [[ ! "$reviewed_pr" =~ ^[0-9]+$ ]] || [[ "$reviewed_pr" != "$PR_NUMBER" ]]; then
            echo "::error::The reviewer reports it read PR '${reviewed_pr}', not #${PR_NUMBER} — it reviewed the wrong pull request (or could not say which). This is NOT a defect in this PR's code and nothing here needs changing; the review itself is void and must be re-run. See #1181."
            exit 1
          fi
          verdict=$(jq -r '.verdict' <<<"$STRUCTURED")
          rationale=$(jq -r '.verdict_rationale // ""' <<<"$STRUCTURED")
          # PROVENANCE MARKER, PREPENDED — `> review.md` here and `>>` below.
          # Prepending (rather than appending) puts it at column 0 on the first
          # line, exactly like the `<!-- review-self-skip -->` marker above, so
          # no markdown indentation rule can ever swallow it. `%s`, not `%d`:
          # `scripts/ralph/test_pr_ready.sh` greps THIS format string out of THIS
          # file, renders it, and round-trips it through `pr-ready.sh`'s parser,
          # which compares bytes — so the literal below is a CROSS-FILE CONTRACT
          # with that parser and `.github/workflows/iteration-trigger.yml`, not a
          # cosmetic detail. Change it in one place and CI goes red in the other.
          # `$PR_NUMBER` is GitHub's own event field, never the agent's claim.
          printf '<!-- creek-review pr=%s -->\n\n' "$PR_NUMBER" > review.md
          jq -r '.review_markdown' <<<"$STRUCTURED" >> review.md
          # Keep the "## Verdict: <verdict>" line exactly — downstream skills
          # (address-feedback, await-claude-review) parse it. The rationale goes
          # on the following line so the verdict is never ambiguous.
          printf '\n\n## Verdict: %s\n' "$verdict" >> review.md
          if [ -n "$rationale" ]; then
            printf '\n%s\n' "$rationale" >> review.md
          fi
          gh pr comment "$PR_NUMBER" -R "$REPO" --body-file review.md
          echo "Posted review with verdict: ${verdict}"
