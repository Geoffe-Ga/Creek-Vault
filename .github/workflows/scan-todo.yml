name: "Scan: TODO/FIXME harvest"

# Thin wrapper over the reusable _claude-scan.yml core. Converts inline
# TODO/FIXME/HACK/XXX markers into tracked, agent-ready GitHub issues.
#
# This is the tracer scan of the autonomous maintenance pipeline — the first
# thread wired end-to-end. Clone this file for each additional scan, changing
# only `name`, the cron, `scan_name`, `max_issues`, and `priority`.
#
# `workflow_dispatch` is REQUIRED on every scan wrapper: it is the hook the
# queue-depth hopper uses to refill the Ralph backlog off-schedule.

on:
  # PAUSED 2026-08-26: automated issue inflow paused by owner request.
  # Re-enable by uncommenting; workflow_dispatch still allows manual runs.
  # schedule:
  # # Weekly Friday 08:00 UTC, per the task table. (cron is UTC.)
  # - cron: "0 8 * * 5"
  workflow_dispatch:
    inputs:
      max_issues:
        description: "Hard cap on issues created this run."
        required: false
        default: "5"
      backlog_ceiling:
        description: "Override the shared agent-ready backlog ceiling for this run (blank = default)."
        required: false
        default: ""

jobs:
  run:
    # A reusable workflow may not request more GITHUB_TOKEN scopes than its
    # caller grants; the repo default is read-only, so grant the core's needs
    # here (contents: read / issues: write / id-token: write) explicitly.
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/_claude-scan.yml
    with:
      scan_name: todo
      max_issues: ${{ fromJSON(github.event.inputs.max_issues || '5') }}
      priority: P3
      # Plumbing, not policy (issue #1516). The backlog check itself stays in
      # exactly one place — scripts/ralph/backlog-gate.sh, run by the core's
      # `gate` job — and every wrapper only forwards the per-run override. It
      # has to be declared on each of the eleven wrappers anyway, because
      # `gh workflow run` rejects an input the workflow does not declare, and
      # the documented catch-up path is "raise the cap for one run".
      #
      # No `fromJSON` here, unlike max_issues: the empty string must survive as
      # "use the default", and fromJSON('') is an error. `github.event.inputs`
      # is null on a schedule trigger, which is what `|| ''` handles.
      backlog_ceiling: ${{ github.event.inputs.backlog_ceiling || '' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
