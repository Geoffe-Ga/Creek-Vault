name: "Hopper: queue-depth refill"

# The never-runs-out guarantee for the Ralph loop. Fixed scan crons are a floor,
# not a guarantee — repo entropy is bursty. This hourly guard measures the
# agent-ready queue depth and, when runway drops below MIN_QUEUE, dispatches the
# most-stale eligible producer scan off-schedule (with a raised max_issues cap).
# When the queue is healthy it stands down; when it is bloated it also stands
# down, letting the backlog drain rather than piling on more.
#
# There is no MAX_QUEUE here any more (issue #1516). The bloat ceiling — and the
# `gh issue list` that measures against it — now live in
# `scripts/ralph/backlog-gate.sh`, which `_claude-scan.yml` runs too. Hopper's
# private `MAX_QUEUE: "80"` guarded only hopper, so the eleven scheduled
# producers filed straight past it and the backlog reached 158 while a "max 80"
# was, technically, in the repository. One implementation, one number, both
# paths: a second copy is how those two facts stopped being the same fact.
#
# No Claude token needed — pure gh + jq queue arithmetic.

on:
  # [tracer-phase] scheduled run disabled — see docs/tracer-phase.md
  # schedule:
  # - cron: "23 * * * *"        # hourly, off the :00 mark to spread API load
  workflow_dispatch:

permissions:
  contents: read               # the checkout below now carries the gate script
  issues: read
  actions: write               # needed to dispatch scan workflows

concurrency:
  group: hopper
  cancel-in-progress: false

jobs:
  check-and-refill:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MIN_QUEUE: "12"           # ~6 hrs of runway at ~2 issues/hr
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1

      - name: Measure the agent-ready backlog against the shared ceiling
        id: backlog_gate
        env:
          # Named on the step as well as the job: this step is the one that
          # talks to the API, and its dependency should be readable without
          # scrolling up. The script takes no shell-interpolated inputs.
          GH_TOKEN: ${{ github.token }}
        run: scripts/ralph/backlog-gate.sh

      - name: Refill if starving
        env:
          # The gate's verdict arrives as DATA, never interpolated into the
          # shell body below — same rule as the scan core's gate step.
          QUEUE_DEPTH: ${{ steps.backlog_gate.outputs.count }}
          QUEUE_PROCEED: ${{ steps.backlog_gate.outputs.proceed }}
        run: |
          set -euo pipefail
          # The depth the gate already measured; the refill arithmetic below is
          # unchanged from when hopper counted for itself.
          COUNT="$QUEUE_DEPTH"

          # The bloat branch, now decided by the shared gate rather than by a
          # ceiling of hopper's own. `proceed=false` means "at or above the
          # cap": stand down and let the backlog drain instead of piling on.
          if [ "$QUEUE_PROCEED" != "true" ]; then
            echo "Queue bloated (gate stood down at depth $COUNT) — standing down so it drains." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$COUNT" -ge "$MIN_QUEUE" ]; then
            echo "Queue healthy (>= $MIN_QUEUE) — standing down." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Starving. Rotate through refill candidates, cheapest/highest-value
          # first. Skips mutation (too expensive — schedule-only) and
          # security/deps/bugs (already daily; not appropriate to spam here).
          for WF in scan-complexity.yml scan-dead-code.yml scan-coverage.yml \
                    scan-perf.yml scan-todo.yml scan-types.yml \
                    scan-docs.yml; do
            LAST=$(gh run list --workflow "$WF" --limit 1 \
                     --json createdAt --jq '.[0].createdAt // "1970-01-01T00:00:00Z"')
            AGE=$(( $(date +%s) - $(date -d "$LAST" +%s) ))
            if [ "$AGE" -gt 21600 ]; then   # don't re-dispatch within 6 hrs
              echo "Runway low ($COUNT < $MIN_QUEUE); dispatching $WF (max_issues=8)." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              gh workflow run "$WF" -f max_issues=8
              exit 0
            fi
          done
          echo "All refill candidates ran within 6 hrs; queue recovers on schedule." \
            | tee -a "$GITHUB_STEP_SUMMARY"
