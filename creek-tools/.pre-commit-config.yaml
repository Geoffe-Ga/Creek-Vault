# Pre-commit hooks configuration for creek-tools
# Install: pre-commit install
# Run manually: pre-commit run --all-files

default_language_version:
  python: python3.11
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-json
  - id: check-added-large-files
    args:
    - --maxkb=500
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-ast
  - id: debug-statements
  - id: check-docstring-first
  - id: detect-private-key
  - id: fix-byte-order-marker
  - id: mixed-line-ending
    args:
    - --fix=lf
  - id: no-commit-to-branch
    args:
    - --branch
    - main
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.2.0
  hooks:
  - id: ruff
    args:
    - --fix
  - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.8.0
  hooks:
  - id: mypy
    # The packages listed here all ship py.typed (or are type stubs).
    # mypy needs the actual package, not just stubs, to resolve types
    # exported by pydantic v2's plugin, hypothesis's strategies, and
    # pytest's fixture types in our test files. python-frontmatter is
    # NOT in this list because pyproject.toml's mypy override already
    # marks it ignore_missing_imports.
    additional_dependencies:
    - types-PyYAML
    - types-chardet
    - types-tqdm
    - pytest>=7.4.0
    - hypothesis>=6.92.0
    - pydantic>=2.0.0
    args:
    - --strict
- repo: https://github.com/PyCQA/bandit
  rev: 1.7.7
  hooks:
  - id: bandit
    args:
    - -c
    - creek-tools/pyproject.toml
    additional_dependencies:
    - bandit[toml]
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v3.0.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.9.0.6
  hooks:
  - id: shellcheck
- repo: https://github.com/asottile/pyupgrade
  rev: v3.15.0
  hooks:
  - id: pyupgrade
    args:
    - --py311-plus
- repo: https://github.com/PyCQA/autoflake
  rev: v2.2.1
  hooks:
  - id: autoflake
    args:
    - --in-place
    - --remove-all-unused-imports
    - --remove-unused-variables
    - --remove-duplicate-keys
    - --ignore-init-module-imports
- repo: https://github.com/guilatrova/tryceratops
  rev: v2.3.2
  hooks:
  - id: tryceratops
- repo: https://github.com/dosisod/refurb
  rev: v2.3.1
  hooks:
  - id: refurb
- repo: https://github.com/jendrikseipp/vulture
  rev: v2.10
  hooks:
  - id: vulture
    args:
    - creek-tools/creek/
    - --min-confidence
    - '80'
- repo: https://github.com/econchick/interrogate
  rev: 1.7.0
  hooks:
  - id: interrogate
    additional_dependencies:
    - setuptools
    args:
    - -vv
    - --fail-under=95
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args:
    - --baseline
    - creek-tools/.secrets.baseline
    exclude: \.secrets\.baseline$
# Local hook: pylint as a CI-aligned gate (CI-002 / CI-004). Runs only
# on staged Python files so it stays fast; CI runs the full --fail-under
# pass over creek/.
- repo: local
  hooks:
  - id: pylint-fast
    name: pylint (fast, staged files only)
    entry: pylint
    # language: python pulls pylint into pre-commit's isolated env so the
    # hook works even when contributors haven't installed dev extras into
    # their ambient PATH.
    language: python
    additional_dependencies:
    - pylint>=3.0.0
    types: [python]
    # pyproject.toml has no [tool.pylint] section yet, so we don't pass
    # --rcfile (pylint warned and fell back to defaults anyway). The
    # CLI --fail-under is the actual enforcement contract.
    args: [--fail-under=9.0]
    files: ^creek-tools/creek/
ci:
  autofix_commit_msg: 'style: auto-fix by pre-commit hooks'
  autoupdate_commit_msg: 'chore: update pre-commit hooks'
  skip: []
