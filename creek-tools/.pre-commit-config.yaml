# Pre-commit hooks configuration for creek-tools
# Install: pre-commit install
# Run manually: pre-commit run --all-files

default_language_version:
  python: python3.11
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-json
  - id: check-added-large-files
    args:
    - --maxkb=500
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-ast
  - id: debug-statements
  # Do not add check-docstring-first here. It treats the PEP 258 attribute
  # docstrings used for module constants throughout this project as duplicate
  # module docstrings (#1759). The lock-backed interrogate gate below owns
  # docstring coverage without rejecting valid attribute documentation.
  - id: detect-private-key
  - id: fix-byte-order-marker
  - id: mixed-line-ending
    args:
    - --fix=lf
  - id: no-commit-to-branch
    args:
    - --branch
    - main
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.5
  # --no-cache: ruff's cache key is mtime-only, and these hooks seed the very
  # cache check-all.sh would otherwise trust; CI has none (issue #1119).
  hooks:
  - id: ruff
    args:
    - --fix
    - --no-cache
  - id: ruff-format
    args:
    - --no-cache
- repo: https://github.com/PyCQA/bandit
  rev: 1.9.4
  hooks:
  - id: bandit
    args:
    - -c
    - creek-tools/pyproject.toml
    # Match scripts/security.sh and CI: low findings are advisory; medium and
    # high findings block. Without this, touching a file with a known low
    # finding can fail after the canonical gate passed (#1764).
    - -ll
    additional_dependencies:
    - bandit[toml]
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v3.0.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.9.0.6
  hooks:
  - id: shellcheck
- repo: https://github.com/asottile/pyupgrade
  rev: v3.15.0
  hooks:
  - id: pyupgrade
    args:
    - --py311-plus
- repo: https://github.com/PyCQA/autoflake
  rev: v2.2.1
  hooks:
  - id: autoflake
    args:
    - --in-place
    - --remove-all-unused-imports
    - --remove-unused-variables
    - --remove-duplicate-keys
    - --ignore-init-module-imports
# Local hook: the dead-code gate (issue #1395). Was the upstream
# jendrikseipp/vulture repo at rev v2.10 with `--min-confidence 80` over
# creek-tools/creek/ — a check that could not fail, because vulture scores
# unused functions/methods/classes at 60%. It also pinned 2.10 while
# uv.lock resolves 2.16, so the hook and the rest of the toolchain ran
# different versions. Routing through the wrapper removes both problems:
# one policy, one version (whatever uv.lock installs), no threshold to
# drift. `language: system` for the same reason as pylint-fast below.
- repo: local
  hooks:
  # Type-check with the project's provisioned, lockfile-backed environment.
  # The isolated mirrors-mypy hook could not import the runtime dependencies
  # of files it followed, producing 135 errors after the canonical strict gate
  # passed. The wrapper is the single local/CI policy (#1759).
  - id: mypy
    name: mypy (strict, lockfile-backed)
    entry: creek-tools/scripts/typecheck.sh
    language: system
    types: [python]
    pass_filenames: false
    files: ^creek-tools/(creek|creek_mcp|tests|scripts)/
  # These three scanners deliberately still gate creek/ alone. #965 owns the
  # ordered cleanup and widening into creek_mcp/; until then pre-commit must
  # ask the same question as their canonical scripts instead of surprising a
  # staged creek_mcp/ or tests/ change with out-of-scope backlog (#1759).
  - id: refurb
    name: refurb (canonical scope)
    entry: creek-tools/scripts/lint-refurb.sh
    language: system
    types: [python]
    pass_filenames: false
    files: ^creek-tools/creek/
  - id: tryceratops
    name: tryceratops (canonical scope)
    entry: creek-tools/scripts/lint-tryceratops.sh
    language: system
    types: [python]
    pass_filenames: false
    files: ^creek-tools/creek/
  - id: interrogate
    name: interrogate (canonical scope)
    entry: creek-tools/scripts/lint-interrogate.sh
    language: system
    types: [python]
    pass_filenames: false
    files: ^creek-tools/creek/
  - id: vulture
    name: vulture (dead code, per-type confidence floors)
    entry: creek-tools/scripts/lint-vulture.sh
    language: system
    types: [python]
    # The gate fixes its own scan scope; passing staged filenames would
    # narrow it and reopen the hole this hook exists to close.
    pass_filenames: false
    # `scripts/` is in the trigger list because lint_vulture.py is the
    # policy: editing a floor or a carve-out must re-run the gate, not
    # wait for the next commit that happens to touch creek/.
    files: ^creek-tools/(creek|creek_mcp|tests|scripts)/
  # The same policy module, pointed at the sibling subproject (#1472).
  # Two hooks rather than one because the two scopes fail independently
  # and a reader of a failed run needs to know which tree is dirty.
  - id: vulture-crawdad
    name: vulture (dead code, crawdad)
    entry: crawdad/scripts/lint-vulture.sh
    language: system
    types: [python]
    pass_filenames: false
    # creek-tools/scripts/ is a trigger for this hook too: the policy it
    # runs lives there, so a carve-out edited in creek-tools must re-run
    # crawdad's gate rather than wait for the next crawdad commit.
    files: ^(crawdad/(crawdad|tests)|creek-tools/scripts)/
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args:
    - --baseline
    - creek-tools/.secrets.baseline
    # Generated contract manifests are registries of SHA-256 checksums. Scanning
    # them as entropy makes every legitimate bundle regeneration uncommittable;
    # schemas and examples remain in scope.
    exclude: ^(creek-tools/\.secrets\.baseline|docs/contracts/[^/]+/manifest\.json)$
# Local hook: pylint as a CI-aligned gate (CI-002 / CI-004). Runs only
# on staged Python files so it stays fast; CI runs the full --fail-under
# pass over creek/ and creek_mcp/.
- repo: local
  hooks:
  - id: pylint-fast
    name: pylint (fast, staged files only)
    entry: pylint
    # `language: system` runs pylint in the developer's already-activated
    # venv (where `pip install -r requirements-dev.txt` has installed the
    # project via `-e .[all,dev]`). Pre-commit's isolated `language: python`
    # venv would not have `creek` itself or third-party runtime deps, so
    # pylint would emit E0401 import-error for every `from creek...` and
    # `import frontmatter|numpy|pydantic` line — driving the score below
    # --fail-under and blocking every commit. Contributors are expected
    # to provision the dev environment before installing pre-commit hooks
    # (CLAUDE.md "Setup" documents this).
    language: system
    types: [python]
    # pyproject.toml has no [tool.pylint] section yet, so we don't pass
    # --rcfile (pylint warned and fell back to defaults anyway). The
    # CLI --fail-under is the actual enforcement contract.
    args: [--fail-under=9.0]
    # Both first-party packages, and only those — tests/ stays out
    # (issue #925 added creek_mcp/).
    files: ^creek-tools/(creek|creek_mcp)/
ci:
  autofix_commit_msg: 'style: auto-fix by pre-commit hooks'
  autoupdate_commit_msg: 'chore: update pre-commit hooks'
  skip: []
