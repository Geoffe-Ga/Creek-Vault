# Pre-commit hooks configuration for creek-tools
# Install: pre-commit install
# Run manually: pre-commit run --all-files

default_language_version:
  python: python3.11
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-json
  - id: check-added-large-files
    args:
    - --maxkb=500
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-ast
  - id: debug-statements
  - id: check-docstring-first
  - id: detect-private-key
  - id: fix-byte-order-marker
  - id: mixed-line-ending
    args:
    - --fix=lf
  - id: no-commit-to-branch
    args:
    - --branch
    - main
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.13
  # --no-cache: ruff's cache key is mtime-only, and these hooks seed the very
  # cache check-all.sh would otherwise trust; CI has none (issue #1119).
  hooks:
  - id: ruff
    args:
    - --fix
    - --no-cache
  - id: ruff-format
    args:
    - --no-cache
- repo: https://github.com/pre-commit/mirrors-mypy
  # Kept in sync with uv.lock (mypy 2.1.0) and pyproject.toml's
  # [project.optional-dependencies].dev pin so all three install paths
  # run the same mypy version (issue #206).
  rev: v2.1.0
  hooks:
  - id: mypy
    # The packages listed here all ship py.typed (or are type stubs).
    # mypy needs the actual package, not just stubs, to resolve types
    # exported by pydantic v2's plugin, hypothesis's strategies, and
    # pytest's fixture types in our test files. python-frontmatter is
    # NOT in this list because pyproject.toml's mypy override already
    # marks it ignore_missing_imports.
    additional_dependencies:
    - types-PyYAML
    - types-chardet
    - types-tqdm
    - pytest>=7.4.0
    - hypothesis>=6.92.0
    - pydantic>=2.0.0
    # anthropic ships py.typed; scripts/ralph/recap.py imports it (guarded),
    # so mypy needs the real package to resolve the module.
    - anthropic>=0.40.0
    # starlette ships py.typed and is a direct dependency as of #1074 (the
    # /v1 HTTP adapter in creek_mcp/httpapi/). The hook runs in its own
    # isolated env, so without this mypy reports import-not-found for every
    # starlette import even though ./scripts/typecheck.sh is clean.
    - starlette>=1.3.1
    args:
    - --strict
- repo: https://github.com/PyCQA/bandit
  rev: 1.9.4
  hooks:
  - id: bandit
    args:
    - -c
    - creek-tools/pyproject.toml
    additional_dependencies:
    - bandit[toml]
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v3.0.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.9.0.6
  hooks:
  - id: shellcheck
- repo: https://github.com/asottile/pyupgrade
  rev: v3.15.0
  hooks:
  - id: pyupgrade
    args:
    - --py311-plus
- repo: https://github.com/PyCQA/autoflake
  rev: v2.2.1
  hooks:
  - id: autoflake
    args:
    - --in-place
    - --remove-all-unused-imports
    - --remove-unused-variables
    - --remove-duplicate-keys
    - --ignore-init-module-imports
- repo: https://github.com/guilatrova/tryceratops
  rev: v2.4.1
  hooks:
  - id: tryceratops
- repo: https://github.com/dosisod/refurb
  rev: v2.3.1
  hooks:
  - id: refurb
- repo: https://github.com/jendrikseipp/vulture
  rev: v2.10
  hooks:
  - id: vulture
    args:
    - creek-tools/creek/
    - --min-confidence
    - '80'
- repo: https://github.com/econchick/interrogate
  rev: 1.7.0
  hooks:
  - id: interrogate
    additional_dependencies:
    - setuptools
    args:
    - -vv
    - --fail-under=95
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args:
    - --baseline
    - creek-tools/.secrets.baseline
    exclude: \.secrets\.baseline$
# Local hook: pylint as a CI-aligned gate (CI-002 / CI-004). Runs only
# on staged Python files so it stays fast; CI runs the full --fail-under
# pass over creek/ and creek_mcp/.
- repo: local
  hooks:
  - id: pylint-fast
    name: pylint (fast, staged files only)
    entry: pylint
    # `language: system` runs pylint in the developer's already-activated
    # venv (where `pip install -r requirements-dev.txt` has installed the
    # project via `-e .[all,dev]`). Pre-commit's isolated `language: python`
    # venv would not have `creek` itself or third-party runtime deps, so
    # pylint would emit E0401 import-error for every `from creek...` and
    # `import frontmatter|numpy|pydantic` line — driving the score below
    # --fail-under and blocking every commit. Contributors are expected
    # to provision the dev environment before installing pre-commit hooks
    # (CLAUDE.md "Setup" documents this).
    language: system
    types: [python]
    # pyproject.toml has no [tool.pylint] section yet, so we don't pass
    # --rcfile (pylint warned and fell back to defaults anyway). The
    # CLI --fail-under is the actual enforcement contract.
    args: [--fail-under=9.0]
    # Both first-party packages, and only those — tests/ stays out
    # (issue #925 added creek_mcp/).
    files: ^creek-tools/(creek|creek_mcp)/
ci:
  autofix_commit_msg: 'style: auto-fix by pre-commit hooks'
  autoupdate_commit_msg: 'chore: update pre-commit hooks'
  skip: []
