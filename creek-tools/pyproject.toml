# pyproject.toml - Python project configuration

[project]
name = "creek-tools"
version = "0.1.0"
description = "A quality-controlled Python project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Generated by SGSG" }
]
dependencies = [
    "typer>=0.27.1",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "python-frontmatter>=1.3.0",
    "chardet>=7.6.0",
    "httpx>=0.27.0",
    "tqdm>=4.70.0",
    # Security: pin mcp above CVE-2026-52869 (cross-principal session
    # injection on Streamable HTTP bearer transport — reachable via
    # creek_mcp), CVE-2026-52870, CVE-2026-59950. All fixed in 1.28.1.
    "mcp>=1.28.1,<2.0.0",
    # creek_mcp.server._serve_network drives uvicorn directly for the TLS
    # network transport (#837), so uvicorn is a direct dependency rather than
    # a transitive one via mcp. Floor matches the uv.lock resolution.
    "uvicorn>=0.52.4",
    # creek_mcp.httpapi (the Adepthood /v1 HTTP application adapter, #1074)
    # imports Starlette directly, so it is declared rather than left
    # transitive via mcp — the undeclared-dependency drift the epic exists to
    # stop. A floor, never a ceiling: the resolved version must stay
    # compatible with the mcp SDK's own Starlette pin, because a conflict
    # there would break the load-bearing MCP transport to serve the new one
    # (see docs/decisions/2026-07-31-adepthood-http-application-api.md,
    # "HTTP framework", reason 1). FastAPI is deliberately not adopted.
    "starlette>=1.6.0",
    # creek_mcp.httpapi.middleware.limits imports Semaphore, WouldBlock and
    # fail_after from anyio at module scope to shed load and enforce the
    # request deadline (#1074), so anyio is a direct dependency rather than
    # something starlette happens to drag in — a starlette release that
    # stopped depending on it would break the /v1 limits middleware with no
    # lockfile signal (#1123). Floor matches the uv.lock resolution. A floor,
    # never a ceiling: anyio is also starlette's own concurrency backend, so a
    # ceiling here could deadlock resolution against the ASGI stack.
    "anyio>=4.14.2",
    # At-rest volume key (creek.confidential): Argon2id / AES-GCM / HKDF are
    # imported unconditionally, so cryptography is a direct base dependency —
    # not left to transitive resolution via mcp -> pyjwt[crypto] (#758).
    # Security: floor raised above PYSEC-2026-3552 (CVE-2026-69247,
    # GHSA-g6cj-pr64-35w5) — PKCS#7 EnvelopedData decryption leaked a
    # Bleichenbacher oracle through distinguishable errors and timing.
    # Introduced in 44.0.0, fixed in 50.0.0 (#1167).
    "cryptography>=50.0.0",
    # Security: pin urllib3 above CVE-2026-44431 / CVE-2026-44432
    # (transitive via requests/conan). Both are fixed in 2.7.0.
    "urllib3>=2.7.0",
    # Security: pin idna above CVE-2026-45409 (transitive via httpx /
    # requests). Fixed in 3.15 — that is the security floor, and it does
    # not move. The declared floor is higher only because a floor also
    # records the resolution this project actually runs (#1000); read
    # 3.15 as the number the advisory fixes and 3.19 as the number the
    # lock resolves.
    "idna>=3.19",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
creek = "creek.cli:app"
creek-tools-mcp = "creek_mcp.server:main"
# The Adepthood /v1 HTTP application adapter (#1074). Separate from
# creek-tools-mcp on purpose: MCP stays the agent adapter, /v1 is the
# application adapter, and both call one behavioural implementation.
creek-tools-api = "creek_mcp.httpapi.cli:main"

[project.optional-dependencies]
# Transport hold, same swap the openai ceiling below holds. anthropic
# 1.0.0 published 2026-08-20 — the first stable major of the SDK that
# `creek.classify` drives — and this declaration was an open
# `>=0.40.0`, so a routine `uv lock --upgrade` adopted it the next day
# with nothing read. It is not only an SDK major: 1.0.0 replaced
# `httpx<1,>=0.23.0` with `httpx2<3,>=2.0.0` as a *hard* requirement
# (openai 2.x offers httpx2 only behind an opt-in extra), so taking it
# stands httpx2 + httpcore2 + httpx2-jsfetch + truststore beside the
# `httpx>=0.27.0` declared above — two independent HTTP stacks in one
# environment. That is the same migration `mcp<2.0.0` (#998) and
# `openai<3.0.0` (#1479) already hold open, so all three move together
# or not at all. The LLM SDK line is issue #999's. Floor is the release
# uv.lock resolves. Vetting tracked in #1593.
anthropic = ["anthropic>=0.125.0,<1.0.0"]
# Transport hold, not a CVE (OSV reports no advisories for openai):
# openai 3.0.0 swapped `httpx<1,>=0.23.0` for `httpx2<3,>=2.7.0` — a
# separate distribution, not a version bump — dragging httpcore2,
# truststore and idna>=3.18 in beside the `httpx>=0.27.0` declared
# above, i.e. two HTTP stacks in one environment. `mcp>=1.28.1,<2.0.0`
# caps the other half of the same swap (#998), so the two majors move
# together or not at all. Floor is the release both locks resolve.
openai = ["openai>=2.41.0,<4.0.0"]
gemini = ["google-genai>=1.0"]
embeddings = [
    # Model-format hold, not a CVE. sentence-transformers loads the
    # model that produces every vector in the embeddings cache, and
    # 6.0.0 published 2026-08-18 against an open `>=2.2.0`, so a bare
    # `uv lock --upgrade` crossed the major three days later. Floor is
    # the release uv.lock resolves; `<6.0.0` holds the major for the
    # vetting pass #1592 tracks.
    "sentence-transformers>=5.7.0,<6.0.0",
    # Interpreter-matrix hold, not a CVE. numpy 2.5.x declares
    # `requires-python >=3.12` while this project declares >=3.11, so an
    # unbounded floor makes the lock resolve *two* numpys — 2.4.6 for
    # 3.11 and 2.5.2 for 3.12+ — and the toolchain cannot straddle that.
    # numpy 2.5's bundled `__init__.pyi` uses PEP 695 `type` statements,
    # which mypy rejects outright under `python_version = "3.11"`
    # (`error: Type statement is only supported in Python 3.12 and
    # greater [syntax]`), so `./scripts/typecheck.sh` fails on any 3.12+
    # developer machine and in CI's 3.12/3.13 jobs while passing on
    # 3.11. `ignore_missing_imports` does not suppress it — the failure
    # is a syntax error inside the stub, not a missing one. Holding
    # numpy on the line that supports the whole declared matrix keeps
    # one numpy everywhere. Lifting this belongs with dropping 3.11 or
    # raising mypy's target, not with a lock refresh (#1000).
    "numpy>=2.4.6,<2.5.0",
    # On-disk format hold, not a CVE. pyarrow reads and writes the
    # embeddings cache — the only file this project keeps in a
    # third-party binary format. `EmbeddingLinker.save_cache` writes
    # snappy parquet with string / list_(float32()) /
    # timestamp("us", tz="UTC") columns, `load_cache` reads it back,
    # `purge_fragment_ids_from_cache` rewrites it after filtering, and
    # `delete_embeddings_cache` reads the row count from its footer.
    # At `>=17.0.0` a relock was free to cross a parquet major against
    # caches already written under the old one. Bounding it is what let
    # 25.0.1 be *read* rather than merely resolved — and reading it is
    # what found the reason not to take it yet: pyarrow 25.0.1 ships no
    # `py.typed` marker, which 24.0.0 does (verified against both
    # wheels). Under mypy strict that turns every `pa.` and `pq.` call
    # in creek/link/embeddings.py into `Any`, on the one module that
    # writes persistent binary data. The only ways to take 25.x are an
    # `ignore_missing_imports` override — which silently drops type
    # checking this project has today — or adopting the third-party
    # `pyarrow-stubs`, whose line still tracks pyarrow 20. Neither
    # belongs in a lock-refresh lane, so the ceiling is `<25.0.0`: the
    # floor records what the lock resolves and has always run, and
    # #1594 owns the adoption once typing is restored (#1001).
    "pyarrow>=24.0.0,<25.0.0",
]
ocr = [
    "pytesseract>=0.3",
    "pdf2image>=1.0",
    # >=12.3.0: fixes 8 pip-audit advisories incl. PYSEC-2026-2253..2257,
    # PYSEC-2026-3451..3453 (font decompression-bomb DoS, WindowsViewer
    # shell injection) reachable via OCR/pptx/markdownify ingestion (#843).
    "pillow>=12.3.0",
]
documents = [
    "python-docx>=1.0.0",
    "pdfminer.six>=20260107",
    "markdownify>=1.2.3",
]
spreadsheets = ["openpyxl>=3.1"]
presentations = ["python-pptx>=0.6"]
gdrive = [
    "google-api-python-client>=2.199.0",
    "google-auth-oauthlib>=1.0",
]
all = [
    # Self-referential extras (pip >= 21.2). Adding a new sub-extra
    # automatically flows into [all] without manual duplication.
    "creek-tools[anthropic,openai,gemini,embeddings,ocr,documents,spreadsheets,presentations,gdrive]",
]
dev = [
    # `tests/conftest.py` imports numpy, `tests/test_classify.py` mocks
    # the anthropic SDK, and `tests/test_ingest_documents.py` parses
    # DOCX/PDF/HTML — so the optional code paths under [all] are not
    # actually optional at test-collection time. Pulling them in here
    # keeps `pip install -e '.[dev]'` aligned with `uv sync --all-extras`
    # so a fresh checkout's `./scripts/check-all.sh` matches CI (issue
    # #206).
    "creek-tools[all]",
    "pytest>=9.1.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.3.0",
    "hypothesis>=6.165.10",
    # Pinned to the same major.minor as uv.lock and
    # .pre-commit-config.yaml's ruff-pre-commit rev so the three install
    # paths (uv sync, pip install -e '.[dev]', pre-commit) run the same
    # ruff version. Bumping requires updating all three together
    # (issues #206, #409). Both ends move together: taking a ceiling
    # widening alone leaves the band spanning two minor lines, which is
    # the drift this pin exists to prevent. 0.15.13 -> 0.16.4 (#1440);
    # the agreement is asserted by
    # tests/test_dependency_pins.py::_LOCKSTEP_TOOLS.
    "ruff>=0.16.4,<0.17",
    # Pinned to the same major.minor as uv.lock and
    # .pre-commit-config.yaml's mirrors-mypy rev so the three install
    # paths (uv sync, pip install -e '.[dev]', pre-commit) run the same
    # mypy version. Bumping requires updating all three together, both
    # ends at once, for the reason on the ruff pin above.
    # 2.1.0 -> 2.3.1 (#1440).
    "mypy>=2.3.1,<2.4.0",
    "pylint>=4.0.7",
    # Pinned to the same version as uv.lock and .pre-commit-config.yaml's
    # PyCQA/bandit rev so the three install paths run the same bandit
    # version. Bumping requires updating all three together
    # (issues #206, #409).
    "bandit>=1.9.4,<2",
    "pip-audit>=2.10.1",
    "radon>=6.0.0",
    "xenon>=0.9.0",
    "interrogate>=1.7.0",
    "refurb>=2.0.0",
    # Pinned to the same version as uv.lock and .pre-commit-config.yaml's
    # tryceratops rev so the three install paths run the same tryceratops
    # version. Bumping requires updating all three together
    # (issues #206, #409).
    "tryceratops>=2.4.1,<3",
    # Floor raised from 2.10 when vulture became a real gate (issue #1395).
    # scripts/lint_vulture.py drives the Python API (Vulture.scavenge,
    # get_unused_code, ignore_decorators) and reads Item.typ/.confidence,
    # and it raises UnknownFindingTypeError on any item type it does not
    # have a confidence floor for — so a major bump that adds a category
    # fails the build loudly instead of passing silently. uv.lock already
    # resolves 2.16; the `<3` ceiling matches the house style used for
    # bandit/tryceratops/ruff.
    "vulture>=2.16,<3",
    "detect-secrets>=1.5.0",
    "pre-commit>=4.6.2",
    "types-PyYAML>=6.0.12.20260815",
    "types-chardet>=5.0.0",
    "types-tqdm>=4.70.0.20260805",
    "types-docutils>=0.22.3.20260724",
    "lxml-stubs>=0.5.1",
]

# This list is a SECOND, independent setuptools declaration surface,
# separate from [tool.uv].constraint-dependencies below — the two do
# not substitute for each other. constraint-dependencies governs the
# resolution graph behind uv.lock; [build-system].requires governs the
# PEP 518 isolated environment the build backend itself runs in. The uv
# constraint provably does not reach here: with the constraint bounded
# to <84.0.0 a wheel build still reported `Generator: setuptools
# (84.0.0)`, while bounding this list instead produced 83.0.0. So the
# PYSEC-2026-3447 floor has to be repeated here or the backend is
# unbounded — `>=68.0` sat here for the whole life of the #861 pin
# admitting 81.0.0, the CVE release. The band is held IDENTICAL to the
# constraint entry below; the two must move together. This bound is
# invisible to uv.lock (verified: `uv lock --check` passes with only
# this line changed), so its guard test in tests/test_dependency_pins.py
# is the only thing holding it (#1258).
[build-system]
requires = ["setuptools>=83.0.0,<85.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# uv.lock is the canonical, fully-pinned resolution for local + CI
# installs (`uv sync --all-extras`). Regenerate with `uv lock` after any
# dependency change; CI runs `uv sync --locked` and fails on a stale lock.
#
# constraint-dependencies floor transitive packages that pip-audit
# flagged (DEP-003). A constraint tightens resolution *if* the package is
# in the graph without adding it as a direct dependency, so a future
# `uv lock` cannot silently regress onto a vulnerable build/dev version.
constraint-dependencies = [
    # Security: matches the base-dependency floor — above PYSEC-2026-3552
    # (CVE-2026-69247), the PKCS#7 EnvelopedData Bleichenbacher oracle.
    # Fixed in 50.0.0 (#1167).
    "cryptography>=50.0.0",
    "pyjwt>=2.13.0",
    # Security: pip arrives transitively via pip-api (a pip-audit dep).
    # Floored above PYSEC-2026-3721, fixed in 26.2. Build/dev tooling
    # only, never a runtime import.
    "pip>=26.2.1",
    # Security: pin setuptools above PYSEC-2026-3447 (CVE-2026-59890,
    # path traversal in the PackageIndex download path) — build/dev
    # tooling only, never a runtime import. Fixed in 83.0.0 (#861), and
    # the floor stays there. 84.0.0 was vetted for the ceiling by
    # building this wheel under both 83.0.0 and 84.0.0 and comparing the
    # results: content-identical, differing only in the `Generator:`
    # string inside .dist-info/WHEEL and RECORD's sha256 of that file.
    # 84.0.0's removals were distutils C-compiler internals this
    # pure-Python build never touches. The ceiling is SemVer `<85.0.0`,
    # so every future 84.x PATCH still resolves freely; 85.0.0 requires
    # its own review before the ceiling moves (#1258). Held identical to
    # [build-system].requires above — move the two together.
    "setuptools>=83.0.0,<85.0.0",
    "wheel>=0.47.0",
    # Security: pin pyasn1 above CVE-2026-59885 (quadratic OID-arc
    # decode DoS) and CVE-2026-59886 (REAL-exponent big-int DoS) —
    # transitive-only via the gdrive extra → google-auth →
    # pyasn1-modules. Both fixed in 0.6.4 (#867).
    "pyasn1>=0.6.4",
    # Security: pin torch above PYSEC-2025-194 (CVE-2025-3000) —
    # transitive-only via the embeddings extra → sentence-transformers,
    # so the floor lives here rather than [project].dependencies.
    # Fixed in 2.13.0 (#861).
    "torch>=2.13.0",
    # NOT a CVE. rpds-py switched from SemVer to CalVer at 2026.5.1 —
    # the line runs 0.29.0, 0.30.0, 2026.5.1, with no 0.31 or 1.0 in
    # between — and raised requires-python to >=3.11, which this project
    # already declares. Transitive-only via mcp → jsonschema (and via
    # referencing); both consumers declare open floors (>=0.25.0 and
    # >=0.7.0), so nothing forced the lock off 0.30.0 for eight months.
    # Keep this a BARE FLOOR: any SemVer-shaped ceiling — <1.0, ~=0.30,
    # or a <2026.7 written as if the month were a minor version —
    # excludes every subsequent CalVer release permanently. Express a
    # bound, if one is ever needed, in CalVer (#1185). Held identical to
    # crawdad/pyproject.toml so both projects resolve the same native
    # extension on the shared MCP path.
    "rpds-py>=2026.6.3",
]

[tool.setuptools.packages.find]
include = ["creek", "creek.*", "creek_mcp", "creek_mcp.*"]

[tool.setuptools.package-data]
"creek.templates" = ["**/*", "**/.gitkeep"]
"creek.classify.examples" = ["*.yaml"]
"creek.generate.exemplars" = ["*.yaml"]

[tool.pytest.ini_options]
# pytest 9 is required: this config uses the `strict_markers` / `strict_config`
# ini options introduced there. uv.lock pins 9.0.3, so this only bites an
# unpinned fallback install, and it bites with a clear pytest error rather than
# silently ignoring the strictness settings below.
minversion = "9.0"

# Strictness is set as INI OPTIONS, not only as the `--strict-markers` /
# `--strict-config` flags in `addopts` below. Under pytest 9 those flags are
# honoured when typed on the command line but do NOT take effect from
# `addopts`: an unregistered marker degraded to a PytestUnknownMarkWarning and
# the run still exited 0. That made the strictness illusory — a typo'd
# `@pytest.mark.integraton` would silently drop a test out of the blocking
# lane, which is precisely the "gate that looks green but tests nothing"
# failure this suite's CI lanes exist to prevent. The flags stay in `addopts`
# for anyone invoking pytest directly; these two lines are what actually bind.
strict_markers = true
strict_config = true

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=creek",
    "--cov=creek_mcp",
    # scripts/ holds one module: scripts/lint_vulture.py, the dead-code
    # gate's policy (issue #1395). It is measured like product code so the
    # gate cannot itself be the untested thing — see scripts/typecheck.sh.
    "--cov=scripts",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
# Lane markers. A test carries at most one of integration/e2e/live; anything
# unmarked is a unit test. `--strict-markers` (above) makes a typo'd or retired
# marker name a collection error rather than a silently-empty selection.
#
#   BLOCKING IN CI (.github/workflows/ci.yml, job `integration-e2e`):
#     integration, e2e — both must be hermetic, or the merge gate is flaky.
#   NOT IN CI:
#     live  — needs credentials/services CI does not have (run it by hand).
#     slow  — benchmarks, too slow for the merge path.
#
# Run each lane through ./scripts/test.sh (--integration/--e2e/--live), which
# owns the marker expressions and the --no-cov policy for the non-unit lanes.
markers = [
    "integration: hermetic cross-component tests — no network, no API keys, no real vault; BLOCKING in CI (deselect with '-m \"not integration\"')",
    "e2e: hermetic end-to-end journeys through the CLI against a synthetic vault; BLOCKING in CI (deselect with '-m \"not e2e\"')",
    "live: opt-in smokes needing a real provider key or a reachable local service; never run in CI, and each skips cleanly when its credential/service is absent (deselect with '-m \"not live\"')",
    "slow: marks tests as slow benchmarks (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["creek", "creek_mcp", "scripts"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
# `extra_checks`, not the `strict_concatenate` this replaced: mypy 2.3
# prints "--strict-concatenate is deprecated; use --extra-checks instead"
# on every run, and a deprecated flag is removed at some major. The
# replacement is a superset — it keeps the Concatenate[] prefix check and
# adds the TypedDict and overload-signature checks — so this tightens the
# gate rather than trading it away (#1440).
extra_checks = true

[[tool.mypy.overrides]]
# vulture ships no py.typed marker, so its Vulture/Item surface is Any.
# scripts/lint_vulture.py confines that to a single conversion function
# which coerces every field explicitly, so no Any escapes into the
# module's own annotated API (issue #1395).
module = "vulture"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "frontmatter"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["markdownify", "pdfminer", "pdfminer.*", "docx", "docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytesseract", "PIL", "PIL.*", "pdf2image", "pdf2image.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "pptx", "pptx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "googleapiclient",
    "googleapiclient.*",
    "google_auth_oauthlib",
    "google_auth_oauthlib.*",
    "google",
    "google.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# faiss-cpu ships no py.typed marker and no stubs. The import is
# function-local and optional (creek/clean/semantic_dedup.py falls back to a
# pure-numpy path when it is absent), so the missing-stub allowance is
# declared here with every other untyped third-party dependency rather than
# as an inline suppression in the source (issue #853).
module = ["faiss", "faiss.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 88
target-version = "py311"
# ruff 0.16 added "*.md" to the default `include`, so the formatter began
# rewriting Python fenced blocks inside prose. Declined deliberately: the
# samples in docs/ are illustrative, not executable — several are
# deliberately aligned into comment tables, and one is a bare continuation
# fragment that is not valid standalone Python — so reformatting them makes
# the documentation harder to read without making any shipped code safer.
# Markdown prose is a docs concern, not a lint surface (#1440).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = []

# Recognise rule codes emitted by refurb/tryceratops so per-line `# noqa: FURB123`
# / `# noqa: TRY101` directives don't trigger RUF100/RUF102 (STYLE-001).
external = [
    "FURB",
    "TRY",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]  # Allow assert in tests
"creek/cli.py" = ["B008"]  # typer.Option() calls in function defaults are idiomatic

[tool.bandit]
exclude_dirs = ["tests", "venv", "virtualenv"]
skips = ["B101"]  # Skip assert_used in tests
