# pyproject.toml - Python project configuration

[project]
name = "creek-tools"
version = "0.1.0"
description = "A quality-controlled Python project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Generated by SGSG" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.3",
    "python-frontmatter>=1.1.0",
    "chardet>=7.4.3",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "mcp>=1.0.0,<2.0.0",
    # Security: pin urllib3 above CVE-2026-44431 / CVE-2026-44432
    # (transitive via requests/conan). Both are fixed in 2.7.0.
    "urllib3>=2.7.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
creek = "creek.cli:app"
creek-tools-mcp = "creek_mcp.server:main"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
embeddings = [
    "sentence-transformers>=2.2.0",
    "numpy>=2.4.4",
]
ocr = [
    "pytesseract>=0.3",
    "pdf2image>=1.0",
    "pillow>=10.0",
]
documents = [
    "python-docx>=1.0.0",
    "pdfminer.six>=20260107",
    "markdownify>=1.2.2",
]
spreadsheets = ["openpyxl>=3.1"]
presentations = ["python-pptx>=0.6"]
gdrive = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
]
all = [
    # Self-referential extras (pip >= 21.2). Adding a new sub-extra
    # automatically flows into [all] without manual duplication.
    "creek-tools[anthropic,embeddings,ocr,documents,spreadsheets,presentations,gdrive]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.3.0",
    "hypothesis>=6.92.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pylint>=3.0.0",
    "bandit>=1.7.5",
    "pip-audit>=2.6.0",
    "radon>=6.0.0",
    "xenon>=0.9.0",
    "interrogate>=1.7.0",
    "refurb>=2.0.0",
    "tryceratops>=2.0.0",
    "vulture>=2.10",
    "detect-secrets>=1.5.0",
    "pre-commit>=3.4.0",
    "types-PyYAML>=6.0.0",
    "types-chardet>=5.0.0",
    "types-tqdm>=4.66.0",
    "types-docutils>=0.20.0",
    "lxml-stubs>=0.5.1",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["creek", "creek.*", "creek_mcp", "creek_mcp.*"]

[tool.setuptools.package-data]
"creek.templates" = ["**/*", "**/.gitkeep"]
"creek.classify.examples" = ["*.yaml"]
"creek.generate.exemplars" = ["*.yaml"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=creek",
    "--cov=creek_mcp",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end tests (deselect with '-m \"not e2e\"')",
    "slow: marks tests as slow benchmarks (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["creek", "creek_mcp"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = "frontmatter"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["markdownify", "pdfminer", "pdfminer.*", "docx", "docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytesseract", "PIL", "PIL.*", "pdf2image", "pdf2image.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "pptx", "pptx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "googleapiclient",
    "googleapiclient.*",
    "google_auth_oauthlib",
    "google_auth_oauthlib.*",
    "google",
    "google.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]  # Allow assert in tests
"creek/cli.py" = ["B008"]  # typer.Option() calls in function defaults are idiomatic

[tool.bandit]
exclude_dirs = ["tests", "venv", "virtualenv"]
skips = ["B101"]  # Skip assert_used in tests
