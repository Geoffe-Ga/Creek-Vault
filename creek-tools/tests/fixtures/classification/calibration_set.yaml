# Calibration set for FEAT-017 LLM classification quality.
#
# Each entry is a fragment with hand-labelled expected classifications.
# `creek classify --calibrate` runs the configured classifier against this
# fixture and reports per-dimension agreement rates. The CI floors live in
# creek.classify.calibration.DEFAULT_FLOORS; a drop below floor signals the
# prompt/example set has regressed.
#
# Frequency naming convention (ONTOLOGY-001, 2026-05): labels are interpreted
# against the canonical F-names in §6.1 of
# ``docs/Ontology/creek_ontology_agent_prompt.md`` — F1 Agency, F2 Receptivity,
# F3 Self-Love / Power, F4 Community Love / Conformity, F5 Achievism,
# F6 Pluralism, F7 Integration, F8 True Self / Transcendence, F9 Unity,
# F10 Emptiness. Pre-ONTOLOGY-001 entries that read more naturally under
# drifted glosses (F2 "tribal-belonging", F8 "ecological holism") have been
# rewritten so each entry's body is a defensible instance of its canonical
# label. See ``docs/decisions/2026-05-23-frequency-naming.md`` for the
# decision record.
#
# Format (per entry):
#   id:              stable cal-NNN identifier
#   title:           short headline (LLM sees this)
#   body:            representative fragment text (LLM sees this)
#   expected:        per-dimension hand-labelled ground truth
#     frequency:        F1..F10
#     phase:            rising | peaking | withdrawal | diminishing | bottoming_out | restoration
#     mode:             inhabit | express | collaborate | integrate | absorb
#     orientation:      do | feel | do_feel
#     dosage:           medicine | toxic | ambiguous
#     voice_register:   confessional | analytical | playful | prophetic | instructional | raw | conversational
#
# Coverage targets: every frequency ≥3 entries; every phase ≥4 entries;
# every mode ≥6 entries; every register and orientation ≥4 entries;
# every dosage ≥6 entries (medicine naturally dominates introspective
# fragments, so its ratio is looser than other dimensions: currently
# ~4.67× the rarest dosage value, tolerate up to ~5× before adding
# more toxic/ambiguous entries). When adding new entries, prefer the
# rarest cell in each dimension so the rarest value stays within ~3×
# the most common on every non-dosage dimension — that keeps the
# agreement metric well-conditioned across every value.
- id: cal-001
  title: Lockout
  body: My keys are gone and I cannot get into the apartment tonight. Stomach is in
    a knot. I keep checking my pockets like that will change something.
  expected:
    frequency: F1
    phase: peaking
    mode: inhabit
    orientation: feel
    dosage: ambiguous
    voice_register: raw
