# pyproject.toml — CrawDad Discord bot

[project]
name = "crawdad"
version = "0.1.0"
description = "Discord bot that consumes the creek-tools MCP surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Geoff E." }
]
dependencies = [
    "discord.py>=2.3.0",
    # Security: pin mcp above CVE-2026-52869 (cross-principal session
    # injection on Streamable HTTP bearer transport). Fixed in 1.28.1.
    "mcp>=1.28.1,<2.0.0",
    "anthropic>=0.40.0",
    "openai>=1.0",
    "google-genai>=1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "filetype>=1.2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
crawdad = "crawdad.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",
    "interrogate>=1.7.0",
    "radon>=6.0.0",
    "xenon>=0.9.0",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# constraint-dependencies floor transitive packages that pip-audit
# flagged (DEP-003). A constraint tightens resolution *if* the package
# is in the graph without adding it as a direct dependency, so a future
# `uv lock` cannot silently regress onto a vulnerable version.
constraint-dependencies = [
    # Security: pin pyasn1 above CVE-2026-59885 (quadratic OID-arc
    # decode DoS) and CVE-2026-59886 (REAL-exponent big-int DoS) —
    # transitive via google-genai → google-auth → pyasn1-modules.
    # Both fixed in 0.6.4 (#867).
    "pyasn1>=0.6.4",
]

[tool.setuptools.packages.find]
include = ["crawdad", "crawdad.*"]

# ADAPT-003: ship the reference workflow YAML files alongside the
# package so ``crawdad.workflows.BUILTIN_WORKFLOWS_DIR`` resolves to a
# populated directory after ``pip install crawdad`` (not only in editable
# / source installs).
[tool.setuptools.package-data]
crawdad = ["builtin_workflows/*.workflow.yaml"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=crawdad",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["crawdad"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# FEAT-035: ``filetype`` is a small pure-Python magic-byte sniffer that
# does not ship a ``py.typed`` marker. The ADR documents why we picked
# it over ``python-magic`` (no libmagic system dep, fewer moving parts);
# the trade-off is that we cannot get static types from the upstream
# package. We use it from a single call site (``verify_mime_type``)
# behind a typed dataclass, so the missing-stubs surface is contained.
[[tool.mypy.overrides]]
module = "filetype"
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
    "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "S101",   # assert is the point of tests
    "TC001",  # type-only imports in tests stay top-level for pytest discovery
    "TC002",  # same — pytest.MonkeyPatch annotation, used only at type-check time
    "TC003",  # same — Path / Any used in fixture annotations
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.interrogate]
fail-under = 95
ignore-init-method = false
ignore-init-module = true
ignore-magic = true
ignore-private = false
ignore-property-decorators = true
ignore-semiprivate = false
exclude = ["tests", "scripts"]
