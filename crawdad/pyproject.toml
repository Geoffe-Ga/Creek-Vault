# pyproject.toml — CrawDad Discord bot

[project]
name = "crawdad"
version = "0.1.0"
description = "Discord bot that consumes the creek-tools MCP surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Geoff E." }
]
dependencies = [
    "discord.py>=2.3.0",
    # Security: pin mcp above CVE-2026-52869 (cross-principal session
    # injection on Streamable HTTP bearer transport). Fixed in 1.28.1.
    "mcp>=1.28.1,<2.0.0",
    "anthropic>=0.40.0",
    "openai>=1.0",
    "google-genai>=1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "filetype>=1.2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
crawdad = "crawdad.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",
    "interrogate>=1.7.0",
    "radon>=6.0.0",
    "xenon>=0.9.0",
    "types-PyYAML>=6.0.0",
    # scripts/security.sh — the security gate — shells out to both of
    # these: pip-audit scans the installed environment and the exported
    # lock, and uv performs the `uv export --locked` that produces that
    # export. CI installs only this extra before running check-all.sh,
    # so the gate's own toolchain has to be declared here or the gate
    # cannot run (#979).
    "pip-audit>=2.10.0",
    "uv>=0.11.16",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# constraint-dependencies floor transitive packages that pip-audit
# flagged (DEP-003). A constraint tightens resolution *if* the package
# is in the graph without adding it as a direct dependency, so a future
# `uv lock` cannot silently regress onto a vulnerable version.
constraint-dependencies = [
    # Security: pin aiohttp above the eleven advisories carried by
    # 3.13.5 — PYSEC-2026-237 and PYSEC-2026-2104 through -2113
    # (CVE-2026-34993 / -47265 / -50269 and -54273 through -54280).
    # Transitive via discord.py → aiohttp, which backs discord.py's
    # REST client — including user-supplied attachment downloads —
    # and its gateway websocket. All eleven fixed in 3.14.1 (#978).
    "aiohttp>=3.14.1",
    # Security: pin pyasn1 above CVE-2026-59885 (quadratic OID-arc
    # decode DoS) and CVE-2026-59886 (REAL-exponent big-int DoS) —
    # transitive via google-genai → google-auth → pyasn1-modules.
    # Both fixed in 0.6.4 (#867).
    "pyasn1>=0.6.4",
    # Security: pin cryptography above PYSEC-2026-3552 (CVE-2026-69247,
    # GHSA-g6cj-pr64-35w5) — PKCS#7 EnvelopedData decryption exposed a
    # Bleichenbacher oracle via distinguishable errors and timing;
    # introduced in 44.0.0, fixed in 50.0.0 (#1167). Supersedes the
    # earlier 48.0.1 floor for GHSA-537c-gmf6-5ccf (#979). Reached
    # transitively via google-genai → google-auth → cryptography and via
    # mcp → pyjwt → cryptography. Both consumers declare open floors
    # (google-auth: cryptography>=38.0.3, pyjwt: cryptography>=3.4.0),
    # so nothing upstream blocks the raise.
    "cryptography>=50.0.0",
    # Security: pin pydantic-settings above GHSA-4xgf-cpjx-pc3j,
    # carried by the previously-locked 2.14.1 — transitive via mcp →
    # pydantic-settings. Fixed in 2.14.2; mcp 1.28.1 declares
    # pydantic-settings>=2.5.2, so the pinned mcp is unaffected (#979).
    "pydantic-settings>=2.14.2",
    # Security: pin python-multipart above PYSEC-2026-3036,
    # PYSEC-2026-3037, and PYSEC-2026-3040, all carried by the
    # previously-locked 0.0.29 — transitive via mcp → python-multipart.
    # 0.0.30 fixes only the first two, so the floor is 0.0.31, the first
    # fully patched release (same first-fully-patched convention as
    # aiohttp>=3.14.1 above). mcp 1.28.1 declares
    # python-multipart>=0.0.9 (#979).
    "python-multipart>=0.0.31",
    # Security: pin starlette above PYSEC-2026-248 and PYSEC-2026-249,
    # both carried by the previously-locked 1.1.0 — transitive via
    # mcp → starlette and mcp → sse-starlette → starlette. 1.3.0 fixes
    # only PYSEC-2026-248, so the floor is 1.3.1, the first fully
    # patched release. mcp 1.28.1 declares starlette>=0.27 (>=0.48.0 on
    # Python ≥3.14) and sse-starlette 3.4.4 declares starlette>=0.49.1,
    # so both consumers accept the raise (#979).
    "starlette>=1.3.1",
]

[tool.setuptools.packages.find]
include = ["crawdad", "crawdad.*"]

# ADAPT-003: ship the reference workflow YAML files alongside the
# package so ``crawdad.workflows.BUILTIN_WORKFLOWS_DIR`` resolves to a
# populated directory after ``pip install crawdad`` (not only in editable
# / source installs).
[tool.setuptools.package-data]
crawdad = ["builtin_workflows/*.workflow.yaml"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=crawdad",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["crawdad"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# FEAT-035: ``filetype`` is a small pure-Python magic-byte sniffer that
# does not ship a ``py.typed`` marker. The ADR documents why we picked
# it over ``python-magic`` (no libmagic system dep, fewer moving parts);
# the trade-off is that we cannot get static types from the upstream
# package. We use it from a single call site (``verify_mime_type``)
# behind a typed dataclass, so the missing-stubs surface is contained.
[[tool.mypy.overrides]]
module = "filetype"
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
    "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "S101",   # assert is the point of tests
    "TC001",  # type-only imports in tests stay top-level for pytest discovery
    "TC002",  # same — pytest.MonkeyPatch annotation, used only at type-check time
    "TC003",  # same — Path / Any used in fixture annotations
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.interrogate]
fail-under = 95
ignore-init-method = false
ignore-init-module = true
ignore-magic = true
ignore-private = false
ignore-property-decorators = true
ignore-semiprivate = false
exclude = ["tests", "scripts"]
